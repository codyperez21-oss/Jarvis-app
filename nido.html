<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0a0a0a">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Talos — Nido</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@300;400;500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --black: #0a0a0a; --card: #181818; --card-raised: #1e1e1e; --border: #2a2a2a;
    --gold: #c9a84c; --gold-dim: #8a6f2e; --teal: #2db3a0; --amber: #e0983a;
    --white: #f0ece4; --gray: #666; --gray-dim: #444;
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { background:var(--black); color:var(--white); font-family:'DM Sans',sans-serif; min-height:100vh; padding-bottom:calc(96px + env(safe-area-inset-bottom, 0px)); }

  .bottom-nav { position:fixed; left:0; right:0; bottom:0; display:flex; border-top:1px solid var(--border); background:#0e0e0e; padding:10px 6px calc(16px + env(safe-area-inset-bottom, 0px)); z-index:50; }
  .bottom-nav a { flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; text-decoration:none; }
  .bottom-nav a svg circle { fill:var(--gray); }
  .bottom-nav a.active svg circle { fill:var(--gold); }
  .bottom-nav a span { font-family:'DM Mono',monospace; font-size:8.5px; letter-spacing:0.04em; color:var(--gray); }
  .bottom-nav a.active span { color:var(--gold); }

  .fab { position:fixed; right:18px; bottom:calc(96px + env(safe-area-inset-bottom, 0px)); width:52px; height:52px; border-radius:50%; background:var(--gold); border:none; display:flex; align-items:center; justify-content:center; box-shadow:0 6px 20px rgba(201,168,76,0.4); z-index:51; text-decoration:none; }
  .fab:active { opacity:0.8; }

  header { padding:28px 20px 20px; border-bottom:1px solid var(--border); }
  .eyebrow { font-family:'DM Mono',monospace; font-size:10px; letter-spacing:0.3em; color:var(--gold); text-transform:uppercase; margin-bottom:4px; }
  .page-title { font-family:'Bebas Neue',sans-serif; font-size:36px; letter-spacing:0.03em; color:var(--white); }
  .page-sub { font-family:'DM Mono',monospace; font-size:11px; color:var(--gray); margin-top:4px; }
  .phase-pill { display:inline-block; margin-top:10px; font-family:'DM Mono',monospace; font-size:9.5px; letter-spacing:0.12em; text-transform:uppercase; color:var(--gold); background:rgba(201,168,76,0.12); border:1px solid rgba(201,168,76,0.35); border-radius:20px; padding:5px 14px; }

  main { padding:0 20px; max-width:640px; margin:0 auto; }

  .section-label { font-family:'DM Mono',monospace; font-size:10px; letter-spacing:0.2em; text-transform:uppercase; color:var(--gray); margin:24px 0 10px; display:flex; align-items:center; gap:10px; }
  .section-label::after { content:''; flex:1; height:1px; background:var(--border); }

  .category-card { background:var(--card); border:1px solid var(--border); border-left:2px solid var(--gold-dim); border-radius:8px; padding:16px 18px; margin-top:12px; }
  .category-name { font-family:'DM Mono',monospace; font-size:11px; letter-spacing:0.1em; text-transform:uppercase; color:var(--gold); margin-bottom:12px; }
  .nido-item { display:flex; align-items:flex-start; gap:10px; padding:9px 0; border-top:1px solid var(--border); }
  .nido-item:first-of-type { border-top:none; padding-top:0; }
  .status-dot { width:9px; height:9px; border-radius:50%; margin-top:4px; flex-shrink:0; }
  .status-dot.pending { background:var(--gray-dim); border:1px solid var(--gray); }
  .status-dot.in_progress { background:var(--amber); }
  .status-dot.resolved { background:var(--teal); }
  .item-text { font-size:13.5px; color:var(--white); line-height:1.4; flex:1; }
  .item-status-label { font-family:'DM Mono',monospace; font-size:8.5px; letter-spacing:0.08em; text-transform:uppercase; color:var(--gray); margin-top:3px; }

  .log-entry { background:var(--card); border:1px solid var(--border); border-radius:8px; padding:14px 16px; margin-top:10px; }
  .log-top { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:6px; }
  .log-category { font-family:'DM Mono',monospace; font-size:9px; letter-spacing:0.1em; text-transform:uppercase; color:var(--gold-dim); }
  .log-date { font-family:'DM Mono',monospace; font-size:9.5px; color:var(--gray-dim); }
  .log-contact { font-size:12.5px; color:var(--gray); margin-bottom:4px; }
  .log-notes { font-size:13.5px; color:var(--white); line-height:1.45; }

  .doc-list { margin-top:6px; margin-left:19px; }
  .doc-row { display:flex; align-items:center; gap:6px; padding:3px 0; }
  .doc-link { font-family:'DM Mono',monospace; font-size:11px; color:var(--teal); text-decoration:none; }
  .doc-link:active { opacity:0.7; }
  .upload-row { margin-top:6px; margin-left:19px; }
  .doc-remove { font-family:'DM Mono',monospace; font-size:9px; letter-spacing:0.05em; color:var(--amber); opacity:0.7; text-decoration:underline; cursor:pointer; margin-left:8px; }
  .doc-remove:active { opacity:1; }
  .upload-label { font-family:'DM Mono',monospace; font-size:9.5px; letter-spacing:0.05em; color:var(--gray-dim); cursor:pointer; text-decoration:underline; }
  .upload-label input { display:none; }
  .upload-status { font-family:'DM Mono',monospace; font-size:9.5px; color:var(--gold); margin-left:8px; }

  .loading-note, .error-note, .empty-note { font-family:'DM Mono',monospace; font-size:11px; color:var(--gray-dim); padding:24px 0; text-align:center; }
  .error-note { color:#d94040; }
</style>
</head>
<body>

<header>
  <div class="eyebrow">Nido</div>
  <div class="page-title">Nido</div>
  <div class="page-sub" id="statusLine">Loading…</div>
  <div class="phase-pill" id="phasePill" style="display:none;"></div>
</header>

<main>
  <div id="categoriesSection"></div>
  <div id="logSection"></div>
</main>

<script>
const NIDO_URL = "https://affable-chachalaca.pikapod.net/webhook/nido-data";
const API_KEY = "cyl6IRJPD86l-1sK30UBZqOEElnBOWReItiGUk68Uck";

const PHASE_LABELS = { deal_formation: "Deal Formation", build_launch: "Build & Launch" };
const STATUS_LABELS = { pending: "Pending", in_progress: "In Progress", resolved: "Resolved" };

function fmtDate(iso) {
  if (!iso) return '';
  const d = new Date(iso + 'T00:00:00');
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
}

async function loadNido() {
  const catEl = document.getElementById('categoriesSection');
  const logEl = document.getElementById('logSection');
  try {
    const response = await fetch(NIDO_URL, { method: "GET", headers: { "X-Api-Key": API_KEY } });
    if (!response.ok) throw new Error("Server returned " + response.status);
    const data = await response.json();

    const phasePill = document.getElementById('phasePill');
    phasePill.textContent = PHASE_LABELS[data.phase] || data.phase;
    phasePill.style.display = 'inline-block';

    const totalItems = (data.categories || []).reduce((sum, c) => sum + c.items.length, 0);
    document.getElementById('statusLine').textContent = `${totalItems} item${totalItems !== 1 ? 's' : ''} across ${(data.categories || []).length} categor${(data.categories || []).length !== 1 ? 'ies' : 'y'}`;

    if (!data.categories || data.categories.length === 0) {
      catEl.innerHTML = '<div class="empty-note">Nothing tracked yet — add an item via chat to get started</div>';
    } else {
      catEl.innerHTML = data.categories.map(cat => `
        <div class="category-card">
          <div class="category-name">${cat.category}</div>
          ${cat.items.map(item => `
            <div class="nido-item">
              <div class="status-dot ${item.status}"></div>
              <div style="flex:1;">
                <div class="item-text">${item.text}</div>
                <div class="item-status-label">${STATUS_LABELS[item.status] || item.status}</div>
                ${(item.documents && item.documents.length > 0) ? `
                  <div class="doc-list">
                    ${item.documents.map(doc => `
                      <div class="doc-row">
                        📎 <a class="doc-link" href="${doc.file_url}" target="_blank" rel="noopener">${doc.file_name}</a>
                        <span class="doc-remove" onclick="deleteNidoDocument('${doc.id}', '${(doc.file_name || '').replace(/'/g, "\\'")}', this)">Remove</span>
                      </div>
                    `).join('')}
                  </div>
                ` : ''}
                <div class="upload-row">
                  <label class="upload-label">+ Add Document
                    <input type="file" onchange="uploadDocument('${item.id}', this)">
                  </label>
                  <span class="upload-status" id="uploadStatus-${item.id}"></span>
                </div>
              </div>
            </div>
          `).join('')}
        </div>
      `).join('');
    }

    if (data.log && data.log.length > 0) {
      logEl.innerHTML = `
        <div class="section-label">Reach-Out Log</div>
        ${data.log.map(l => `
          <div class="log-entry">
            <div class="log-top">
              <div class="log-category">${l.category}</div>
              <div class="log-date">${fmtDate(l.date)}</div>
            </div>
            ${l.contact ? `<div class="log-contact">${l.contact}</div>` : ''}
            <div class="log-notes">${l.notes || ''}</div>
          </div>
        `).join('')}
      `;
    }
  } catch (err) {
    document.getElementById('statusLine').textContent = "";
    catEl.innerHTML = `<div class="error-note">Couldn't load: ${err.message}</div>`;
  }
}

async function deleteNidoDocument(documentId, fileName, el) {
  if (!confirm('Remove "' + fileName + '"? This deletes the file permanently and can\'t be undone.')) return;
  const row = el.closest('.doc-row');
  row.style.opacity = '0.4';
  try {
    const response = await fetch('https://affable-chachalaca.pikapod.net/webhook/nido-delete-document', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Api-Key': API_KEY },
      body: JSON.stringify({ document_id: documentId })
    });
    if (!response.ok) throw new Error('Server returned ' + response.status);
    loadNido();
  } catch (err) {
    row.style.opacity = '1';
    alert("Couldn't remove that document: " + err.message);
  }
}

async function uploadDocument(itemId, inputEl) {
  const file = inputEl.files[0];
  if (!file) return;
  const statusEl = document.getElementById('uploadStatus-' + itemId);
  statusEl.textContent = 'Uploading…';
  try {
    const base64 = await new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result.split(',')[1]);
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
    const response = await fetch('https://affable-chachalaca.pikapod.net/webhook/nido-upload-document', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Api-Key': API_KEY },
      body: JSON.stringify({ nido_item_id: itemId, file_name: file.name, mime_type: file.type || 'application/octet-stream', file_content_base64: base64 })
    });
    if (!response.ok) throw new Error('Server returned ' + response.status);
    statusEl.textContent = '';
    loadNido();
  } catch (err) {
    statusEl.textContent = 'Failed: ' + err.message;
  }
}

loadNido();
</script>
