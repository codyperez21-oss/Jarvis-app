<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Talos — Business</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="talos-ui.css">
</head>
<body>
<header class="top"><div class="eyebrow">Business</div><h1 id="title">&nbsp;</h1><div class="sub" id="sub">&nbsp;</div></header>
<main id="root"><div class="sk"></div><div class="sk"></div></main>
<div id="talosNav"></div>
<script src="talos-ui.js"></script>
<script>
const BID = (() => { const b = new URLSearchParams(location.search).get('b'); return BIZ[b] ? b : 'rvltn'; })();
let OPEN = {};
function dueLabel(i) { if (!i.due_at) return ''; const t = Date.parse(i.due_at.length === 10 ? i.due_at + 'T23:59:00' : i.due_at); if (isNaN(t)) return ''; const d = t - Date.now(); if (d < 0) return 'Overdue'; const h = Math.round(d / 3600000); return h < 24 ? 'Due in ' + Math.max(h, 1) + 'h' : 'Due ' + new Date(t).toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' }); }
function when(at) { const t = new Date(at); return isNaN(t) ? '' : t.toLocaleString('en-US', { weekday: 'short', hour: 'numeric', minute: '2-digit' }); }
function statusPill(r) { if (r.status === 'in_progress') return '<span class="pill amber">In progress</span>'; return '<span class="pill amber">Sent to ' + esc(botName(r.source)) + '</span>'; }
function section(d) {
  const items = d.items || [], batches = d.batches || [], rec = d.recent || [];
  let h = '<div class="sec" style="margin-top:8px">Needs you</div>';
  if (!items.length && !batches.length) h += '<div class="sub" style="padding:6px 0">Nothing waiting on you here.</div>';
  else h += '<div class="card" style="padding:4px 16px">' + batches.map(b => '<a class="row" href="needs.html?b=' + esc(BID) + '"><span class="t">Approve ' + esc(b.count) + ' outreach emails</span><span class="pill amber">Review</span></a>').join('') +
    items.map(i => { const dl = dueLabel(i); return '<a class="row" href="needs.html?b=' + esc(BID) + '"><span class="t">' + esc(i.text) + '<br>' + chip(i.source) + '</span>' + (dl ? '<span class="pill ' + (dl === 'Overdue' ? 'red' : 'amber') + '">' + esc(dl) + '</span>' : '<span class="pill amber">Review</span>') + '</a>'; }).join('') + '</div>';
  if (rec.length) h += '<div class="sec">In progress</div><div class="card" style="padding:4px 16px">' + rec.map(r => '<div class="row" style="display:flex"><span class="t">' + esc(r.text) + '</span>' + statusPill(r) + '</div>').join('') + '</div>';
  const up = (d.upcoming || []).slice().sort((a, b) => new Date(a.at) - new Date(b.at));
  if (up.length) h += '<div class="sec">Coming up ' + MID + ' 48h</div><div class="card" style="padding:4px 16px">' + up.map(e => '<div class="tl"><time>' + esc(when(e.at)) + '</time><span class="t">' + esc(e.label) + '</span></div>').join('') + '</div>';
  const nums = d.numbers || [];
  h += '<div class="sec">Numbers</div>' + (nums.length ? nums.map(numHtml).join('') : '<div class="sub" style="padding:6px 0">No numbers yet.</div>');
  if (BID === 'rvltn') h += '<div class="sub" style="margin-top:10px;font-size:12px">Revenue counts priced packages purchased that week (price plus travel fee). Packages with no price recorded are not counted.</div>';
  const reps = d.reports || [];
  h += '<div class="sec">Latest reports</div>' + (reps.length ? reps.map(r => {
    const open = !!OPEN[r.source], links = (r.links || []).filter(l => safeUrl(l.url));
    return '<div class="card' + (open ? ' open' : '') + '"><button class="card-h" data-b="' + esc(r.source) + '"><div class="t"><b>' + esc(botName(r.source)) + ' ' + MID + ' ' + esc(ROLE[r.source] || '') + '</b><span>' + esc(r.title) + '</span></div><span class="chev">' + String.fromCharCode(9654) + '</span></button><div class="card-b"><div class="sub" style="margin-bottom:8px">Week of ' + esc(fmtWeek(r.week_of)) + '</div><div class="md">' + md(r.summary) + '</div>' +
      (links.length ? '<div class="links">' + links.map(l => '<a href="' + safeUrl(l.url) + '" target="_blank" rel="noopener noreferrer">' + esc(l.label) + '</a>').join('') + '</div>' : '') + '</div></div>';
  }).join('') : '<div class="sub" style="padding:6px 0">No reports yet.</div>');
  return h;
}
function render(d) { document.title = 'Talos ' + String.fromCharCode(8212) + ' ' + d.name; $t('title').textContent = d.name; $t('sub').textContent = 'Needs you, numbers and latest reports'; $t('root').innerHTML = section(d); }
const $t = id => document.getElementById(id);
document.addEventListener('click', e => { const h = e.target.closest('.card-h[data-b]'); if (h) { OPEN[h.dataset.b] = !OPEN[h.dataset.b]; h.parentElement.classList.toggle('open', OPEN[h.dataset.b]); } });
$t('title').textContent = BIZ[BID].name;
api('business-detail?b=' + encodeURIComponent(BID)).then(render).catch(e => { $t('root').innerHTML = '<div class="err">Couldn' + String.fromCharCode(8217) + 't load: ' + esc(e.message) + ' <button class="btn" style="margin-top:10px" onclick="location.reload()">Retry</button></div>'; });
</script>
<script src="talos-nav.js"></script>
</body>
</html>
