<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0a0a0a">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Talos — Clinics</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@300;400;500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --black: #0a0a0a; --card: #181818; --card-raised: #1e1e1e; --border: #2a2a2a;
    --gold: #c9a84c; --gold-dim: #8a6f2e; --grape: #9b6bd6; --grape-dim: #6b4a9e;
    --white: #f0ece4; --gray: #666; --gray-dim: #444;
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { background:var(--black); color:var(--white); font-family:'DM Sans',sans-serif; min-height:100vh; padding-bottom:calc(96px + env(safe-area-inset-bottom, 0px)); }

  .bottom-nav { position:fixed; left:0; right:0; bottom:0; display:flex; border-top:1px solid var(--border); background:#0e0e0e; padding:10px 6px calc(16px + env(safe-area-inset-bottom, 0px)); z-index:50; }
  .bottom-nav a { flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; text-decoration:none; }
  .bottom-nav a svg circle { fill:var(--gray); }
  .bottom-nav a.active svg circle { fill:var(--grape); }
  .bottom-nav a span { font-family:'DM Mono',monospace; font-size:8.5px; letter-spacing:0.04em; color:var(--gray); }
  .bottom-nav a.active span { color:var(--grape); }

  .fab { position:fixed; right:18px; bottom:calc(96px + env(safe-area-inset-bottom, 0px)); width:52px; height:52px; border-radius:50%; background:var(--gold); border:none; display:flex; align-items:center; justify-content:center; box-shadow:0 6px 20px rgba(201,168,76,0.4); z-index:51; text-decoration:none; }
  .fab:active { opacity:0.8; }

  header { padding:28px 20px 20px; border-bottom:1px solid var(--border); }
  .eyebrow { font-family:'DM Mono',monospace; font-size:10px; letter-spacing:0.3em; color:var(--grape); text-transform:uppercase; margin-bottom:4px; }
  .page-title { font-family:'Bebas Neue',sans-serif; font-size:36px; letter-spacing:0.03em; color:var(--white); }
  .page-sub { font-family:'DM Mono',monospace; font-size:11px; color:var(--gray); margin-top:4px; }

  main { padding:0 20px; max-width:640px; margin:0 auto; }

  .clinic-card { background:var(--card); border-radius:18px; margin-top:12px; overflow:hidden; transition:border-color 0.2s; }
  .clinic-card.open { border-color:var(--grape-dim); }
  .clinic-header { display:grid; grid-template-columns:1fr auto; align-items:center; gap:14px; padding:18px 20px; cursor:pointer; user-select:none; }
  .clinic-name-block { min-width:0; }
  .clinic-name { font-size:19px; font-weight:600; color:var(--grape); line-height:1.25; }
  .clinic-contact { font-family:'DM Mono',monospace; font-size:11px; color:var(--gray); margin-top:4px; }
  .clinic-contact.unset { color:var(--gray-dim); font-style:italic; }
  .clinic-meta-row { display:flex; gap:14px; margin-top:8px; }
  .clinic-cadence { font-family:'DM Mono',monospace; font-size:9.5px; letter-spacing:0.05em; color:var(--gold-dim); background:rgba(201,168,76,0.08); border:1px solid rgba(201,168,76,0.2); border-radius:3px; padding:3px 7px; }
  .clinic-last { font-family:'DM Mono',monospace; font-size:9.5px; letter-spacing:0.05em; color:var(--gray); }
  .expand-btn { width:26px; height:26px; display:flex; align-items:center; justify-content:center; border:1px solid var(--border); border-radius:6px; color:var(--gray); transition:all 0.2s; flex-shrink:0; }
  .clinic-card.open .expand-btn { border-color:var(--grape-dim); color:var(--grape); transform:rotate(180deg); }

  .clinic-detail { display:none; border-top:1px solid var(--border); padding:20px; background:#101010; }
  .clinic-card.open .clinic-detail { display:block; }

  .info-grid { display:grid; grid-template-columns:1fr 1fr; gap:14px 16px; margin-bottom:18px; }
  .info-item { display:flex; flex-direction:column; gap:3px; }
  .info-val { font-family:'DM Mono',monospace; font-size:12.5px; color:var(--white); word-break:break-word; }
  .info-key { font-family:'DM Mono',monospace; font-size:8px; letter-spacing:0.15em; color:var(--gray); text-transform:uppercase; }
  .info-full { grid-column:1 / -1; }

  .touchpoints-label { font-family:'DM Mono',monospace; font-size:9px; letter-spacing:0.2em; color:var(--grape); text-transform:uppercase; margin:18px 0 10px; padding-top:16px; border-top:1px solid var(--border); }
  .touchpoint-row { background:var(--card-raised); border:1px solid var(--border); border-left:2px solid var(--grape-dim); border-radius:4px; padding:11px 14px; margin-bottom:8px; }
  .touchpoint-date { font-family:'DM Mono',monospace; font-size:11px; color:var(--grape); }
  .touchpoint-notes { font-size:13px; color:var(--white); margin-top:4px; line-height:1.45; }
  .no-touchpoints { font-family:'DM Mono',monospace; font-size:11px; color:var(--gray-dim); }

  .history-toggle { display:flex; align-items:center; gap:6px; padding:8px 0; cursor:pointer; user-select:none; }
  .history-toggle span:first-child { font-family:'DM Mono',monospace; font-size:10px; letter-spacing:0.05em; color:var(--gray); text-transform:uppercase; }
  .history-chevron { font-size:10px; color:var(--gray); transition:transform 0.2s; }
  .history-rest { display:none; }
  .history-rest.open { display:block; }

  .relationship-summary-label { font-family:'DM Mono',monospace; font-size:9px; letter-spacing:0.2em; color:var(--grape); text-transform:uppercase; margin-bottom:8px; }
  .relationship-summary-box { background:rgba(155,107,214,0.08); border:1px solid rgba(155,107,214,0.25); border-radius:4px; padding:12px 14px; font-size:13px; color:var(--white); line-height:1.5; margin-bottom:16px; }

  .loading-note, .error-note { font-family:'DM Mono',monospace; font-size:11px; color:var(--gray-dim); padding:24px 0; text-align:center; }
  .error-note { color:#d94040; }

  .edit-btn { margin-top:16px; padding-top:16px; border-top:1px solid var(--border); font-family:'DM Mono',monospace; font-size:10px; letter-spacing:0.15em; text-transform:uppercase; color:var(--gray); text-align:center; cursor:pointer; user-select:none; transition:color 0.2s; }
  .edit-btn:hover { color:var(--grape); }

  .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.7); display:none; align-items:flex-end; justify-content:center; z-index:100; }
  .modal-overlay.open { display:flex; }
  .modal-box { background:var(--card); border:1px solid var(--border); border-radius:14px 14px 0 0; padding:24px 20px 28px; width:100%; max-width:480px; max-height:88vh; overflow-y:auto; }
  .modal-title { font-family:'Bebas Neue',sans-serif; font-size:24px; letter-spacing:0.02em; color:var(--grape); margin-bottom:18px; }
  .form-row { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .form-field { margin-bottom:14px; }
  .form-label { font-family:'DM Mono',monospace; font-size:9px; letter-spacing:0.15em; color:var(--gray); text-transform:uppercase; margin-bottom:6px; display:block; }
  .form-input, .form-select { width:100%; background:#101010; border:1px solid var(--border); border-radius:6px; padding:10px 11px; color:var(--white); font-family:'DM Sans',sans-serif; font-size:13.5px; }
  .form-input:focus, .form-select:focus { outline:none; border-color:var(--grape-dim); }
  textarea.form-input { resize:vertical; min-height:60px; font-family:'DM Sans',sans-serif; }
  .modal-actions { display:flex; gap:10px; margin-top:8px; }
  .modal-btn { flex:1; padding:13px 0; border-radius:8px; font-family:'DM Mono',monospace; font-size:11px; letter-spacing:0.1em; text-transform:uppercase; cursor:pointer; border:1px solid var(--border); background:transparent; color:var(--gray); }
  .modal-btn.save { background:var(--grape); border-color:var(--grape); color:#fff; }
  .modal-btn.save:disabled { opacity:0.5; cursor:default; }
  .modal-error { color:#d94040; font-family:'DM Mono',monospace; font-size:11px; margin-top:12px; display:none; }

  .header-row { display:flex; justify-content:space-between; align-items:flex-end; gap:12px; }
  .watch-btn { font-family:'DM Mono',monospace; font-size:10px; letter-spacing:0.1em; text-transform:uppercase; color:var(--grape); background:rgba(155,107,214,0.1); border:1px solid rgba(155,107,214,0.3); border-radius:6px; padding:9px 14px; cursor:pointer; white-space:nowrap; }

  .watch-item-card { background:var(--card-raised); border:1px solid var(--border); border-radius:8px; padding:16px 18px; margin-top:14px; }
  .watch-item-tag { font-family:'DM Mono',monospace; font-size:8.5px; letter-spacing:0.12em; text-transform:uppercase; padding:3px 8px; border-radius:3px; display:inline-block; margin-bottom:8px; }
  .watch-item-tag.regulation { background:rgba(224,152,58,0.15); color:#e0983a; border:1px solid rgba(224,152,58,0.3); }
  .watch-item-tag.news { background:rgba(155,107,214,0.15); color:var(--grape); border:1px solid rgba(155,107,214,0.3); }
  .watch-item-title { font-size:15px; font-weight:600; color:var(--white); margin-bottom:6px; line-height:1.3; }
  .watch-item-summary { font-size:13px; color:var(--gray); line-height:1.5; }
  .watch-item-link { font-family:'DM Mono',monospace; font-size:10px; color:var(--gold-dim); margin-top:8px; display:inline-block; text-decoration:none; }
  .watch-item-date { font-family:'DM Mono',monospace; font-size:9px; color:var(--gray-dim); margin-top:8px; }

  .watch-brief-section { background:var(--card-raised); border:1px solid rgba(155,107,214,0.3); border-radius:10px; padding:18px 20px; margin-bottom:6px; }
  .watch-brief-label { font-family:'DM Mono',monospace; font-size:9px; letter-spacing:0.2em; color:var(--grape); text-transform:uppercase; margin-bottom:10px; }
  .watch-brief-text { font-size:14px; color:var(--white); line-height:1.6; margin-bottom:16px; }
  .watch-actions-label { font-family:'DM Mono',monospace; font-size:9px; letter-spacing:0.15em; color:var(--gold-dim); text-transform:uppercase; margin-bottom:10px; }
  .watch-action-row { display:flex; gap:10px; padding:10px 0; border-top:1px solid var(--border); font-size:13px; line-height:1.5; color:var(--white); }
  .watch-action-row:first-of-type { border-top:none; }
  .watch-action-num { font-family:'Bebas Neue',sans-serif; font-size:18px; color:var(--gold); flex-shrink:0; }
  .watch-brief-week { font-family:'DM Mono',monospace; font-size:9px; color:var(--gray-dim); margin-top:14px; }

  .watch-modal-box { display:flex; flex-direction:column; max-height:82vh; padding:0; overflow:hidden; }
  .watch-modal-header { display:flex; justify-content:space-between; align-items:center; padding:20px 20px 14px; flex-shrink:0; }
  .watch-modal-header .modal-title { margin-bottom:0; }
  .watch-modal-close { width:30px; height:30px; display:flex; align-items:center; justify-content:center; border:1px solid var(--border); border-radius:50%; color:var(--gray); font-size:16px; cursor:pointer; flex-shrink:0; }
  .watch-modal-body { overflow-y:auto; padding:0 20px 24px; flex:1; }

  .modal-box { display:flex; flex-direction:column; max-height:82vh; padding:0; }
  .modal-header-row { display:flex; justify-content:space-between; align-items:center; padding:20px 20px 14px; flex-shrink:0; }
  .modal-header-row .modal-title { margin-bottom:0; }
  .modal-close-x { width:30px; height:30px; display:flex; align-items:center; justify-content:center; border:1px solid var(--border); border-radius:50%; color:var(--gray); font-size:16px; cursor:pointer; flex-shrink:0; }
  .modal-body-scroll { overflow-y:auto; padding:0 20px 24px; flex:1; }
  .pl-wrap { margin-top:16px; }
  .pl-head { display:flex; justify-content:space-between; align-items:baseline; margin-top:18px; }
  .pl-title { font-family:'Bebas Neue',sans-serif; font-size:24px; letter-spacing:0.04em; color:var(--white); }
  .pl-sub { font-family:'DM Mono',monospace; font-size:10px; color:var(--gray); }
  .pl-chips { display:flex; gap:6px; overflow-x:auto; padding:10px 0 4px; }
  .pl-chip { flex-shrink:0; font-family:'DM Mono',monospace; font-size:10px; letter-spacing:0.05em; color:var(--gray); border:1px solid var(--border); border-radius:14px; padding:6px 10px; cursor:pointer; background:var(--card); }
  .pl-chip b { color:var(--white); font-weight:500; margin-left:4px; }
  .pl-chip.on { border-color:var(--grape); color:var(--grape); }
  .pl-chip.alert b { color:var(--gold); }
  .pl-lead { background:var(--card); border-radius:14px; margin-top:8px; overflow:hidden; }
  .pl-row { display:grid; grid-template-columns:1fr auto; gap:10px; padding:14px 16px; cursor:pointer; align-items:center; }
  .pl-name { font-size:15px; font-weight:600; color:var(--white); line-height:1.25; }
  .pl-meta { font-family:'DM Mono',monospace; font-size:10px; color:var(--gray); margin-top:3px; }
  .pl-badge { font-family:'DM Mono',monospace; font-size:9px; letter-spacing:0.08em; text-transform:uppercase; border-radius:4px; padding:4px 7px; border:1px solid var(--border); color:var(--gray); white-space:nowrap; }
  .pl-badge.contacted { color:#7fb2e5; border-color:#2d4a66; }
  .pl-badge.warm { color:var(--amber, #e0983a); border-color:#6b4a1a; }
  .pl-badge.hot { color:#0a0a0a; background:var(--gold); border-color:var(--gold); }
  .pl-badge.won { color:#6fcf8f; border-color:#2d6644; }
  .pl-badge.closed { color:#c26b6b; border-color:#5a2d2d; }
  .pl-tags { display:flex; gap:6px; margin-top:6px; flex-wrap:wrap; }
  .pl-tag { font-family:'DM Mono',monospace; font-size:9px; letter-spacing:0.05em; border-radius:3px; padding:2px 6px; background:rgba(201,168,76,0.1); color:var(--gold); border:1px solid rgba(201,168,76,0.25); }
  .pl-tag.pend { background:rgba(155,107,214,0.1); color:var(--grape); border-color:rgba(155,107,214,0.3); }
  .pl-detail { display:none; border-top:1px solid var(--border); background:#101010; padding:14px 16px; }
  .pl-lead.open .pl-detail { display:block; }
  .pl-info { font-family:'DM Mono',monospace; font-size:11px; color:var(--white); line-height:1.7; word-break:break-word; }
  .pl-info a { color:var(--grape); }
  .pl-ev { border-left:2px solid var(--border); padding:2px 0 2px 10px; margin-top:10px; }
  .pl-ev-top { font-family:'DM Mono',monospace; font-size:9.5px; letter-spacing:0.05em; color:var(--gold-dim); text-transform:uppercase; }
  .pl-ev-txt { font-size:12.5px; color:var(--white); margin-top:2px; word-break:break-word; }
  .pl-ev-reply { font-size:12px; color:var(--gray); margin-top:4px; padding:6px 8px; background:#0c0c0c; border-radius:6px; white-space:pre-wrap; }
  .pl-sec { font-family:'DM Mono',monospace; font-size:8px; letter-spacing:0.15em; color:var(--gray); text-transform:uppercase; margin:16px 0 4px; }
  .pl-actions { display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
  .pl-act { font-family:'DM Mono',monospace; font-size:10px; border:1px solid var(--grape-dim); color:var(--grape); border-radius:6px; padding:8px 10px; cursor:pointer; }
  .pl-act.danger { border-color:#5a2d2d; color:#c26b6b; }
  .pl-act.dis { opacity:0.4; pointer-events:none; }
  .pl-note { width:100%; margin-top:8px; background:#0c0c0c; border:1px solid var(--border); border-radius:6px; color:var(--white); font-family:'DM Sans',sans-serif; font-size:13px; padding:8px 10px; }
  .pl-empty { font-family:'DM Mono',monospace; font-size:11px; color:var(--gray); padding:16px 0; }
  .pl-divider { border-top:1px solid var(--border); margin-top:22px; }
</style>
</head>
<body>

<header>
  <div class="eyebrow">Replete Rx</div>
  <div class="header-row">
    <div>
      <div class="page-title">Clinics</div>
      <div class="page-sub" id="clinicCount">Loading…</div>
    </div>
    <div class="watch-btn" onclick="openPeptideWatchModal()">💊 Peptide Watch</div>
  </div>
</header>

<main>
  <div id="clinicList"></div>
  <div class="pl-divider"></div>
  <div class="pl-head">
    <div class="pl-title">Outreach Pipeline</div>
    <div class="pl-sub" id="plSub">Loading…</div>
  </div>
  <div class="pl-chips" id="plChips"></div>
  <div id="plList"></div>
</main>

<div class="modal-overlay" id="peptideWatchModal">
  <div class="modal-box watch-modal-box">
    <div class="watch-modal-header">
      <div>
        <div class="modal-title">Peptide Watch</div>
        <div id="watchCount" class="page-sub">Loading…</div>
      </div>
      <div class="watch-modal-close" onclick="closePeptideWatchModal()">✕</div>
    </div>
    <div class="watch-modal-body">
      <div id="watchBriefSection"></div>
      <div id="watchItemList"></div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="editModal">
  <div class="modal-box">
    <div class="modal-header-row">
      <div class="modal-title">Edit Clinic</div>
      <div class="modal-close-x" onclick="closeEditModal()">✕</div>
    </div>
    <div class="modal-body-scroll">
    <input type="hidden" id="editClinicId">
    <div class="form-field">
      <label class="form-label">Clinic Name</label>
      <input type="text" class="form-input" id="editName">
    </div>
    <div class="form-row">
      <div class="form-field">
        <label class="form-label">Contact Name</label>
        <input type="text" class="form-input" id="editContact">
      </div>
      <div class="form-field">
        <label class="form-label">Status</label>
        <select class="form-select" id="editStatus">
          <option value="active">Active</option>
          <option value="inactive">Inactive</option>
        </select>
      </div>
    </div>
    <div class="form-row">
      <div class="form-field">
        <label class="form-label">Phone</label>
        <input type="text" class="form-input" id="editPhone">
      </div>
      <div class="form-field">
        <label class="form-label">Email</label>
        <input type="email" class="form-input" id="editEmail">
      </div>
    </div>
    <div class="form-field">
      <label class="form-label">Address</label>
      <input type="text" class="form-input" id="editAddress">
    </div>
    <div class="form-field">
      <label class="form-label">Scope of Practice</label>
      <textarea class="form-input" id="editScope"></textarea>
    </div>
    <div class="form-field">
      <label class="form-label">Reach-Out Cadence (days)</label>
      <input type="number" class="form-input" id="editCadence" min="1">
    </div>
    <div class="modal-error" id="editError"></div>
    <div class="modal-actions">
      <div class="modal-btn" id="editCancelBtn" onclick="closeEditModal()">Cancel</div>
      <div class="modal-btn save" id="editSaveBtn" onclick="saveClinicEdit()">Save Changes</div>
    </div>
    </div>
  </div>
</div>

<script>
const CLINICS_URL = "https://affable-chachalaca.pikapod.net/webhook/clinics-data";
const CLINIC_EDIT_URL = "https://affable-chachalaca.pikapod.net/webhook/clinic-edit";
const API_KEY = "cyl6IRJPD86l-1sK30UBZqOEElnBOWReItiGUk68Uck";

let clinicsData = [];

function fmtDate(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
}

function daysSince(iso) {
  if (!iso) return null;
  const then = new Date(iso);
  const now = new Date();
  return Math.floor((now - then) / (1000 * 60 * 60 * 24));
}

function renderClinic(c, idx) {
  const since = daysSince(c.last_touchpoint_date);
  const lastLabel = c.last_touchpoint_date ? `Last touch: ${since}d ago` : 'No touchpoints yet';

  return `
    <div class="clinic-card" id="clinic-${idx}">
      <div class="clinic-header" onclick="toggleClinic(${idx})">
        <div class="clinic-name-block">
          <div class="clinic-name">${c.name}</div>
          <div class="clinic-contact${c.contact_name ? '' : ' unset'}">${c.contact_name || 'No contact name set'}</div>
          <div class="clinic-meta-row">
            <div class="clinic-cadence">Every ${c.cadence_days || 14}d</div>
            <div class="clinic-last">${lastLabel}</div>
          </div>
        </div>
        <div class="expand-btn">
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M2 4L6 8L10 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        </div>
      </div>
      <div class="clinic-detail">
        ${c.relationship_status_summary ? `
          <div class="relationship-summary-label">Relationship Status</div>
          <div class="relationship-summary-box">${c.relationship_status_summary}</div>
        ` : ''}
        <div class="info-grid">
          ${c.contact_name ? `<div class="info-item"><div class="info-val">${c.contact_name}</div><div class="info-key">Contact</div></div>` : ''}
          ${c.phone ? `<div class="info-item"><div class="info-val">${c.phone}</div><div class="info-key">Phone</div></div>` : ''}
          ${c.email ? `<div class="info-item"><div class="info-val">${c.email}</div><div class="info-key">Email</div></div>` : ''}
          ${c.address ? `<div class="info-item info-full"><div class="info-val">${c.address}</div><div class="info-key">Address</div></div>` : ''}
          ${c.scope_of_practice ? `<div class="info-item info-full"><div class="info-val">${c.scope_of_practice}</div><div class="info-key">Scope of Practice</div></div>` : ''}
        </div>
        <div class="touchpoints-label">Reach-Out History — ${c.touchpoints.length} logged</div>
        ${c.touchpoints.length ? renderTouchpointHistory(c.touchpoints, idx) : '<div class="no-touchpoints">No reach-outs logged yet</div>'}
        <div class="edit-btn" onclick="openEditModal(${idx})">Edit Clinic</div>
      </div>
    </div>
  `;
}

function renderTouchpointHistory(touchpoints, idx) {
  const [latest, ...rest] = touchpoints;
  const latestHtml = `
    <div class="touchpoint-row">
      <div class="touchpoint-date">${fmtDate(latest.date)}</div>
      ${latest.notes ? `<div class="touchpoint-notes">${latest.notes}</div>` : ''}
    </div>
  `;
  if (rest.length === 0) return latestHtml;
  const restHtml = rest.map(t => `
    <div class="touchpoint-row">
      <div class="touchpoint-date">${fmtDate(t.date)}</div>
      ${t.notes ? `<div class="touchpoint-notes">${t.notes}</div>` : ''}
    </div>
  `).join("");
  return `
    ${latestHtml}
    <div class="history-toggle" id="tp-toggle-${idx}" onclick="toggleTouchpointHistory(${idx})">
      <span id="tp-toggle-label-${idx}" data-count="${rest.length}">Show ${rest.length} earlier</span>
      <span class="history-chevron" id="tp-chevron-${idx}">▾</span>
    </div>
    <div class="history-rest" id="tp-rest-${idx}">${restHtml}</div>
  `;
}

function toggleTouchpointHistory(idx) {
  const restEl = document.getElementById(`tp-rest-${idx}`);
  const chevronEl = document.getElementById(`tp-chevron-${idx}`);
  const labelEl = document.getElementById(`tp-toggle-label-${idx}`);
  const isOpen = restEl.classList.toggle('open');
  chevronEl.style.transform = isOpen ? 'rotate(180deg)' : '';
  labelEl.textContent = isOpen ? 'Hide earlier' : 'Show ' + labelEl.dataset.count + ' earlier';
}

function toggleClinic(idx) {
  document.getElementById(`clinic-${idx}`).classList.toggle('open');
}

function openEditModal(idx) {
  const c = clinicsData[idx];
  if (!c) return;
  document.getElementById('editClinicId').value = c.id;
  document.getElementById('editName').value = c.name || '';
  document.getElementById('editContact').value = c.contact_name || '';
  document.getElementById('editPhone').value = c.phone || '';
  document.getElementById('editEmail').value = c.email || '';
  document.getElementById('editAddress').value = c.address || '';
  document.getElementById('editScope').value = c.scope_of_practice || '';
  document.getElementById('editCadence').value = c.cadence_days || 14;
  document.getElementById('editStatus').value = c.status || 'active';
  document.getElementById('editError').style.display = 'none';
  document.getElementById('editModal').classList.add('open');
}

function closeEditModal() {
  document.getElementById('editModal').classList.remove('open');
}

async function saveClinicEdit() {
  const saveBtn = document.getElementById('editSaveBtn');
  const errorEl = document.getElementById('editError');
  errorEl.style.display = 'none';

  const name = document.getElementById('editName').value.trim();
  if (!name) {
    errorEl.textContent = 'Clinic name is required';
    errorEl.style.display = 'block';
    return;
  }

  const cadenceRaw = parseInt(document.getElementById('editCadence').value, 10);
  const payload = {
    id: document.getElementById('editClinicId').value,
    name: name,
    contact_name: document.getElementById('editContact').value.trim() || null,
    phone: document.getElementById('editPhone').value.trim() || null,
    email: document.getElementById('editEmail').value.trim() || null,
    address: document.getElementById('editAddress').value.trim() || null,
    scope_of_practice: document.getElementById('editScope').value.trim() || null,
    cadence_days: Number.isFinite(cadenceRaw) && cadenceRaw > 0 ? cadenceRaw : 14,
    status: document.getElementById('editStatus').value
  };

  saveBtn.textContent = 'Saving…';
  saveBtn.setAttribute('disabled', 'true');

  try {
    const response = await fetch(CLINIC_EDIT_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-Api-Key": API_KEY },
      body: JSON.stringify(payload)
    });
    if (!response.ok) throw new Error("Server returned " + response.status);
    closeEditModal();
    await loadClinics();
  } catch (err) {
    errorEl.textContent = "Couldn't save: " + err.message;
    errorEl.style.display = 'block';
  } finally {
    saveBtn.textContent = 'Save Changes';
    saveBtn.removeAttribute('disabled');
  }
}

async function loadClinics() {
  const listEl = document.getElementById('clinicList');
  try {
    const response = await fetch(CLINICS_URL, { method: "GET", headers: { "X-Api-Key": API_KEY } });
    if (!response.ok) throw new Error("Server returned " + response.status);
    const data = await response.json();

    const nActive = (data.clinics || []).filter(c => c.status === 'active').length;
    document.getElementById('clinicCount').textContent = `${nActive} active clinic${nActive !== 1 ? 's' : ''}`;

    if (!data.clinics || data.clinics.length === 0) {
      clinicsData = [];
      listEl.innerHTML = '<div class="loading-note">No clinics yet — add one through the Chat tab</div>';
      return;
    }

    data.clinics.sort((a, b) => (b.status === 'active') - (a.status === 'active'));
    clinicsData = data.clinics;
    listEl.innerHTML = data.clinics.map(renderClinic).join("");
  } catch (err) {
    document.getElementById('clinicCount').textContent = "";
    listEl.innerHTML = `<div class="error-note">Couldn't load clinics: ${err.message}</div>`;
  }
}

const WATCH_URL = "https://affable-chachalaca.pikapod.net/webhook/peptide-watch-data";
let peptideWatchLoaded = false;

function openPeptideWatchModal() {
  document.getElementById('peptideWatchModal').classList.add('open');
  if (!peptideWatchLoaded) {
    peptideWatchLoaded = true;
    loadPeptideWatch();
  }
}

function closePeptideWatchModal() {
  document.getElementById('peptideWatchModal').classList.remove('open');
}

async function loadPeptideWatch() {
  const listEl = document.getElementById('watchItemList');
  const briefEl = document.getElementById('watchBriefSection');
  try {
    const response = await fetch(WATCH_URL, { method: "GET", headers: { "X-Api-Key": API_KEY } });
    if (!response.ok) throw new Error("Server returned " + response.status);
    const data = await response.json();

    document.getElementById('watchCount').textContent = `${data.items.length} item${data.items.length !== 1 ? 's' : ''}`;

    if (data.brief && data.brief.brief_text) {
      let actions = [];
      try { actions = typeof data.brief.recommended_actions === 'string' ? JSON.parse(data.brief.recommended_actions) : (data.brief.recommended_actions || []); } catch (e) {}
      briefEl.innerHTML = `
        <div class="watch-brief-section">
          <div class="watch-brief-label">This Week's Brief</div>
          <div class="watch-brief-text">${data.brief.brief_text}</div>
          ${actions.length ? `
            <div class="watch-actions-label">Recommended Actions</div>
            ${actions.map((a, i) => `<div class="watch-action-row"><div class="watch-action-num">${i + 1}</div><div>${a}</div></div>`).join('')}
          ` : ''}
          <div class="watch-brief-week">Week of ${fmtDate(data.brief.week_of)}</div>
        </div>
      `;
    }

    if (!data.items || data.items.length === 0) {
      listEl.innerHTML = '<div class="loading-note">Nothing new found yet — checks run weekly</div>';
      return;
    }

    listEl.innerHTML = data.items.map(i => `
      <div class="watch-item-card">
        <div class="watch-item-tag ${i.category}">${i.category}</div>
        <div class="watch-item-title">${i.title}</div>
        <div class="watch-item-summary">${i.summary}</div>
        ${i.source_url ? `<a class="watch-item-link" href="${i.source_url}" target="_blank">View source →</a>` : ''}
        <div class="watch-item-date">Found ${fmtDate(i.found_date)}</div>
      </div>
    `).join("");
  } catch (err) {
    document.getElementById('watchCount').textContent = "";
    listEl.innerHTML = `<div class="error-note">Couldn't load: ${err.message}</div>`;
  }
}

loadClinics();
const PL_BASE = "https://affable-chachalaca.pikapod.net/webhook/";
let plLeads = [], plFilter = 'all', plOpen = null, plMeta = {};
const PL_GROUPS = [
  ['needs', 'Needs you', l => l.needs_decision],
  ['cold', 'Cold', l => l.status === 'cold'],
  ['contacted', 'Contacted', l => l.status === 'contacted'],
  ['warm', 'Warm', l => l.status === 'warm'],
  ['hot', 'Hot', l => l.status === 'hot_opportunity' || l.status === 'call_ready'],
  ['won', 'Won', l => l.status === 'won'],
  ['closed', 'Closed', l => ['lost','unsubscribed','bounced','do_not_contact'].includes(l.status)]
];
const PL_STATUS_LABEL = { cold:'Cold', contacted:'Contacted', warm:'Warm', call_ready:'Call ready', hot_opportunity:'Hot', won:'Won', lost:'Lost', unsubscribed:'Unsubscribed', bounced:'Bounced', do_not_contact:'Do not contact' };
const PL_EVENT_LABEL = { lead_created:'Added', lead_updated:'Updated', status_change:'Stage change', email_sent:'Email sent', reply_received:'Reply received', call_scheduled:'Call scheduled', note:'Note', draft_ready:'Draft ready', decision:'Your decision', decision_ack:'Apollo confirmed' };
const PL_DECISIONS = [
  ['approve_outreach','Approve outreach',false], ['send_followup','Send follow-up',false], ['hold','Hold',false], ['skip','Skip',false],
  ['mark_call_ready','Mark call ready',false], ['mark_won','Mark won',false], ['mark_lost','Mark lost',true], ['do_not_contact','Do not contact',true]
];
function plEsc(s) { return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function plBadgeClass(s) { return s === 'hot_opportunity' || s === 'call_ready' ? 'hot' : (['lost','unsubscribed','bounced','do_not_contact'].includes(s) ? 'closed' : s); }
function plWhen(iso) { if (!iso) return ''; return new Date(iso).toLocaleString('en-US', { month:'short', day:'numeric', hour:'numeric', minute:'2-digit' }); }
function plUrl(u) { return /^https?:\/\//i.test(u || '') ? plEsc(u) : ''; }

async function loadPipeline() {
  try {
    const r = await fetch(PL_BASE + "pipeline-overview", { headers: { "X-Api-Key": API_KEY } });
    if (!r.ok) throw new Error("Server returned " + r.status);
    const d = await r.json();
    plLeads = d.leads || [];
    plMeta = d.ingest || {};
    renderPipeline();
  } catch (e) {
    document.getElementById('plSub').textContent = '';
    document.getElementById('plList').innerHTML = '<div class="error-note">Couldn\'t load pipeline: ' + plEsc(e.message) + '</div>';
  }
}

function renderPipeline() {
  const total = plLeads.length;
  const touched = plLeads.filter(l => l.status !== 'cold').length;
  const last = plMeta.last_ingest_at ? 'Apollo last synced ' + plWhen(plMeta.last_ingest_at.replace(' ', 'T').replace(/([+-]\d\d)$/, '$1:00')) : 'Apollo has not synced yet';
  document.getElementById('plSub').textContent = total + ' clinics · ' + touched + ' contacted · ' + last;
  const chips = [['all', 'All', () => true]].concat(PL_GROUPS);
  document.getElementById('plChips').innerHTML = chips.map(g => {
    const n = plLeads.filter(g[2]).length;
    return '<div class="pl-chip' + (plFilter === g[0] ? ' on' : '') + (g[0] === 'needs' && n ? ' alert' : '') + '" onclick="plSetFilter(\'' + g[0] + '\')">' + g[1] + '<b>' + n + '</b></div>';
  }).join('');
  const sel = chips.find(g => g[0] === plFilter) || chips[0];
  const rows = plLeads.filter(sel[2]);
  const el = document.getElementById('plList');
  if (!total) { el.innerHTML = '<div class="pl-empty">No leads yet. Apollo will populate this as it works.</div>'; return; }
  if (!rows.length) { el.innerHTML = '<div class="pl-empty">Nothing here.</div>'; return; }
  el.innerHTML = rows.map(l => {
    const ev = l.last_event ? (PL_EVENT_LABEL[l.last_event.type] || l.last_event.type) + ' · ' + plWhen(l.last_event.at) : (l.last_touch_date ? 'Last touch ' + plEsc(l.last_touch_date) : 'Not contacted yet');
    return '<div class="pl-lead' + (plOpen === l.id ? ' open' : '') + '" id="pl-' + l.id + '">' +
      '<div class="pl-row" onclick="plToggle(' + l.id + ')"><div>' +
        '<div class="pl-name">' + plEsc(l.practice_name) + '</div>' +
        '<div class="pl-meta">' + plEsc(l.city) + ' · ' + plEsc(l.external_id) + ' · ' + plEsc(ev) + '</div>' +
        '<div class="pl-tags">' + (l.needs_decision ? '<span class="pl-tag">Needs your decision</span>' : '') +
          (l.pending_decision ? '<span class="pl-tag pend">Waiting on Apollo: ' + plEsc(l.pending_decision.decision.replace(/_/g, ' ')) + (l.pending_decision.ack === 'failed' ? ' (failed)' : '') + '</span>' : '') + '</div>' +
      '</div><div class="pl-badge ' + plBadgeClass(l.status) + '">' + plEsc(PL_STATUS_LABEL[l.status] || l.status) + '</div></div>' +
      '<div class="pl-detail" id="pld-' + l.id + '">' + (plOpen === l.id ? '<div class="pl-empty">Loading…</div>' : '') + '</div></div>';
  }).join('');
  if (plOpen !== null) plLoadDetail(plOpen);
}

function plSetFilter(f) { plFilter = f; plOpen = null; renderPipeline(); }
function plToggle(id) {
  if (plOpen === id) { plOpen = null; document.getElementById('pl-' + id).classList.remove('open'); return; }
  if (plOpen !== null) { const prev = document.getElementById('pl-' + plOpen); if (prev) prev.classList.remove('open'); }
  plOpen = id;
  document.getElementById('pl-' + id).classList.add('open');
  plLoadDetail(id);
}

async function plLoadDetail(id) {
  const box = document.getElementById('pld-' + id);
  if (!box) return;
  const l = plLeads.find(x => x.id === id) || {};
  try {
    const r = await fetch(PL_BASE + "pipeline-lead-timeline?id=" + encodeURIComponent(id), { headers: { "X-Api-Key": API_KEY } });
    if (!r.ok) throw new Error("Server returned " + r.status);
    const d = await r.json();
    const lead = d.lead || l;
    const info = [];
    if (lead.medical_director) info.push('Director: ' + plEsc(lead.medical_director));
    if (lead.public_email) info.push('Email: ' + plEsc(lead.public_email));
    if (lead.phone) info.push('Phone: ' + plEsc(lead.phone));
    if (plUrl(lead.website)) info.push('<a href="' + plUrl(lead.website) + '" target="_blank" rel="noopener">Website</a>');
    if (plUrl(lead.contact_form_url)) info.push('<a href="' + plUrl(lead.contact_form_url) + '" target="_blank" rel="noopener">Contact form</a>');
    if (lead.address) info.push(plEsc(lead.address));
    if (lead.notes) info.push('Notes: ' + plEsc(lead.notes));
    const evs = (d.events || []).map(e => {
      const who = e.source === 'grok-bot' ? 'Apollo' : (e.source === 'cody' ? 'You' : plEsc(e.source));
      const stage = e.new_status ? ' → ' + plEsc(PL_STATUS_LABEL[e.new_status] || e.new_status) : '';
      const txt = e.summary || e.note || '';
      return '<div class="pl-ev"><div class="pl-ev-top">' + plEsc(PL_EVENT_LABEL[e.event_type] || e.event_type) + stage + ' · ' + who + ' · ' + plEsc(plWhen(e.created_at)) + '</div>' +
        (txt ? '<div class="pl-ev-txt">' + plEsc(txt) + '</div>' : '') +
        (e.reply_text_untrusted ? '<div class="pl-ev-reply">' + plEsc(String(e.reply_text_untrusted).slice(0, 800)) + '</div>' : '') + '</div>';
    }).join('');
    box.innerHTML =
      '<div class="pl-info">' + (info.length ? info.join('<br>') : 'No contact details on file yet.') + '</div>' +
      '<div class="pl-sec">Your decision</div>' +
      '<div class="pl-actions">' + PL_DECISIONS.map(x => '<div class="pl-act' + (x[2] ? ' danger' : '') + '" onclick="plDecide(' + id + ',\'' + x[0] + '\',this)">' + x[1] + '</div>').join('') + '</div>' +
      '<input class="pl-note" id="pln-' + id + '" maxlength="280" placeholder="Optional note for Apollo">' +
      '<div class="pl-sec">History</div>' + (evs || '<div class="pl-empty">No activity yet.</div>');
  } catch (e) {
    box.innerHTML = '<div class="error-note">Couldn\'t load: ' + plEsc(e.message) + '</div>';
  }
}

async function plDecide(id, decision, btn) {
  const danger = ['mark_lost', 'do_not_contact', 'mark_won'].includes(decision);
  if (danger && !confirm('Confirm: ' + decision.replace(/_/g, ' ') + '? This changes the lead status immediately.')) return;
  const noteEl = document.getElementById('pln-' + id);
  document.querySelectorAll('#pld-' + id + ' .pl-act').forEach(b => b.classList.add('dis'));
  try {
    const r = await fetch(PL_BASE + "pipeline-decide", { method: "POST", headers: { "Content-Type": "application/json", "X-Api-Key": API_KEY }, body: JSON.stringify({ leadId: id, decision: decision, note: noteEl ? noteEl.value : '' }) });
    const d = await r.json();
    if (!r.ok || !d.ok) throw new Error(d.error || ('Server returned ' + r.status));
    await loadPipeline();
  } catch (e) {
    document.querySelectorAll('#pld-' + id + ' .pl-act').forEach(b => b.classList.remove('dis'));
    alert('Couldn\'t save: ' + e.message);
  }
}

loadPipeline();
</script>
