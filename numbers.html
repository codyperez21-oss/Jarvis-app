<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script src="talos-auth.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Talos — Numbers</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="talos-ui.css">
</head>
<body>
<header class="top"><div class="eyebrow">Talos</div><h1>Numbers</h1><div class="sub" id="sub">&nbsp;</div></header>
<main id="root"><div class="sk"></div><div class="sk"></div></main>
<div id="talosNav"></div>
<script src="talos-ui.js"></script>
<script>
let OPEN = {};
function card(b) {
  const nums = b.numbers || [];
  if (!nums.length && (b.id === 'trading' || b.id === 'nido')) return '';
  const open = !!OPEN[b.id], top = nums.slice(0, 3), rest = nums.slice(3);
  return '<div class="card' + (open ? ' open' : '') + '"><div style="padding:16px 16px 4px"><div class="eyebrow">' + esc(b.id === 'rvltn' ? 'Practice' : b.id === 'replete' ? 'Outreach' : b.id === 'youtube' ? 'YouTube' : b.id === 'trading' ? 'Paper account' : 'Project') + '</div>' +
    '<a href="business.html?b=' + esc(b.id) + '" style="color:inherit;text-decoration:none"><h2 style="font-family:\'Bebas Neue\',sans-serif;font-weight:400;font-size:28px;letter-spacing:.03em;margin-top:2px">' + esc(b.name) + '</h2></a></div>' +
    '<div style="padding:0 16px 16px">' + (top.length ? top.map(numHtml).join('') : '<div class="sub" style="padding:8px 0">No numbers yet.</div>') +
    (rest.length ? '<div class="card-b" style="padding:0">' + rest.map(numHtml).join('') + '</div><button type="button" class="btn" style="width:100%;margin-top:10px" data-b="' + esc(b.id) + '">' + (open ? 'Show fewer' : 'Show all ' + nums.length) + '</button>' : '') + '</div></div>';
}
function render(d) {
  document.getElementById('sub').textContent = 'By business, this week against last week';
  document.getElementById('root').innerHTML = (d.businesses || []).map(card).join('');
}
document.addEventListener('click', e => { const h = e.target.closest('button[data-b]'); if (h) { OPEN[h.dataset.b] = !OPEN[h.dataset.b]; h.parentElement.parentElement.classList.toggle('open', OPEN[h.dataset.b]); h.textContent = OPEN[h.dataset.b] ? 'Show fewer' : 'Show all'; } });
api('numbers-by-business').then(render).catch(e => { document.getElementById('root').innerHTML = '<div class="err">Couldn’t load: ' + esc(e.message) + '</div>'; });
</script>
<script src="talos-nav.js"></script>
</body>
</html>
