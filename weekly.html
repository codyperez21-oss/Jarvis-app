<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script src="talos-auth.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Talos — Weekly Review</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="talos-ui.css">
</head>
<body>
<header class="top">
  <div class="eyebrow">Talos</div><h1>Weekly Review</h1><div class="sub" id="sub">&nbsp;</div>
  <div class="weekbar"><button class="wb" id="prev" aria-label="Older week">‹</button><select id="sel" aria-label="Week"></select><button class="wb" id="next" aria-label="Newer week">›</button></div>
</header>
<main id="root"><div class="sk"></div><div class="sk"></div></main>
<div id="talosNav"></div>
<script src="talos-ui.js"></script>
<script>
let DATA = null, OPEN = {};
const ORDER = ['pheme', 'apollo', 'endeavour'];
const EXPECT = { pheme:'Social media', apollo:'Replete RX outreach', endeavour:'YouTube' };
function decisionText(a) { const d = a.decision; if (d === 'approve') return 'Approved'; if (d === 'changes') return 'Changes requested'; if (d === 'dismiss') return 'Skipped'; if (d === 'other') return 'Your answer'; const o = (a.options || []).find(x => 'option:' + x.id === d); return o ? o.label : String(d); }
function statusPill(a) { const n = a.status_note ? ': ' + a.status_note : ''; if (a.status === 'done') return '<span class="pill green">Done' + esc(n) + '</span>'; if (a.status === 'failed') return '<span class="pill red">Failed' + esc(n) + '</span>'; if (a.status === 'in_progress') return '<span class="pill amber">In progress' + esc(n) + '</span>'; return '<span class="pill amber">Sent to ' + esc(botName(a.source)) + '</span>'; }
function itemsHtml(r) {
  if (!(r.action_items || []).length) return '';
  return '<div class="sec" style="margin-top:18px">Action items</div>' + r.action_items.map(a => '<div class="ai"><div class="t">' + esc(a.text) + '</div><div class="m">' + (a.decision ? '<span>' + esc(decisionText(a)) + '</span>' + statusPill(a) : '<a class="pill amber" style="text-decoration:none" href="needs.html">Waiting on you</a>') + '</div></div>').join('');
}
function body(r, pm) {
  const keys = Object.keys(r.metrics || {}), links = (r.links || []).filter(l => safeUrl(l.url));
  return (keys.length ? '<div class="tiles">' + keys.map(k => tileHtml(k, r.metrics[k], (r.prev_metrics || {})[k])).join('') + '</div>' : '') + seriesHtml(r.metrics_series) + itemsHtml(r) +
    '<details class="sum"><summary>Read the full report</summary><div class="md">' + md(r.summary) + '</div></details>' +
    (links.length ? '<div class="links">' + links.map(l => '<a href="' + safeUrl(l.url) + '" target="_blank" rel="noopener noreferrer">' + esc(l.label) + '</a>').join('') + '</div>' : '');
}
function missing() { return DATA.deadline_passed ? '<span class="pill amber">Not in yet</span>' : '<span class="pill">Due 12:00 PM ET</span>'; }
function render() {
  document.getElementById('sub').textContent = 'Week of ' + fmtWeek(DATA.week_of) + (DATA.week_of === DATA.current_week ? ' · this week' : '');
  document.getElementById('sel').innerHTML = DATA.weeks.map(w => '<option value="' + esc(w) + '"' + (w === DATA.week_of ? ' selected' : '') + '>' + esc(fmtWeek(w)) + (w === DATA.current_week ? ' (this week)' : '') + '</option>').join('');
  const i = DATA.weeks.indexOf(DATA.week_of); document.getElementById('prev').disabled = i >= DATA.weeks.length - 1; document.getElementById('next').disabled = i <= 0;
  const by = {}; (DATA.reports || []).forEach(r => { by[r.source] = r; });
  const waiting = (DATA.reports || []).reduce((n, r) => n + (r.action_items || []).filter(a => !a.decision || a.status === 'failed').length, 0);
  let h = waiting ? '<a class="banner" href="needs.html"><b>' + waiting + (waiting === 1 ? ' item needs' : ' items need') + ' you</b><span>Open ›</span></a>' : '';
  const hm = by.hermes;
  h += '<div class="sec">Summary</div><div class="card"><div style="padding:16px"><div class="q-top">' + chip('hermes') + (hm ? '' : missing()) + '</div>' + (hm ? '<div style="font-weight:600;font-size:17px;margin:10px 0">' + esc(hm.title) + '</div><div class="md">' + md(hm.summary) + '</div>' : '<div class="sub" style="margin-top:8px">Hermes hasn’t posted this week’s summary.</div>') + '</div></div>';
  const present = (DATA.reports || []).map(r => r.source).filter(s => s !== 'hermes'), srcs = present.concat(ORDER.filter(s => !present.includes(s)));
  const so = DATA.social || {};
  h += '<div class="sec">Social engagement</div><div class="card"><div style="padding:16px"><div class="q-top">' + chip('pheme') + bizTag('social') + '</div><div class="sub" style="margin-top:8px">Batches ' + esc(so.batches || 0) + ' · Approved ' + esc(so.items_approved || 0) + ' · Posted ' + esc(so.items_posted || 0) + ' · Failures ' + esc(so.failures || 0) + '</div></div></div>';
  h += '<div class="sec">Reports by business</div>' + srcs.map(s => {
    const r = by[s], open = !!OPEN[s], bz = r ? r.business : ({ pheme:'rvltn', apollo:'replete', endeavour:'youtube' })[s];
    return '<div class="card' + (open ? ' open' : '') + '"><button class="card-h" data-b="' + esc(s) + '"><div class="t">' + (BIZ[bz] ? '<i class="bz" style="font-style:normal;display:block">' + esc(BIZ[bz].short) + '</i>' : '') + '<b>' + esc(botName(s)) + ' ' + MID + ' ' + esc(ROLE[s] || '') + '</b><span>' + (r ? esc(r.title) : esc(EXPECT[s] || '')) + '</span></div>' + (r ? '<span class="pill green">In</span>' : missing()) + '<span class="chev">' + String.fromCharCode(9654) + '</span></button><div class="card-b">' + (r ? body(r) : '<div class="sub">' + (DATA.deadline_passed ? 'Not in yet.' : 'Expected by 12:00 PM ET Sunday.') + '</div>') + '</div></div>';
  }).join('');
  document.getElementById('root').innerHTML = h;
}
async function loadWeek(w) { try { DATA = await api('weekly-review' + (w ? '?week=' + encodeURIComponent(w) : '')); render(); } catch (e) { document.getElementById('root').innerHTML = '<div class="err">Couldn’t load: ' + esc(e.message) + '</div>'; } }
document.addEventListener('click', e => { const h = e.target.closest('.card-h[data-b]'); if (h) { OPEN[h.dataset.b] = !OPEN[h.dataset.b]; h.parentElement.classList.toggle('open', OPEN[h.dataset.b]); } });
document.getElementById('sel').addEventListener('change', e => loadWeek(e.target.value));
document.getElementById('prev').addEventListener('click', () => { const n = DATA && DATA.weeks[DATA.weeks.indexOf(DATA.week_of) + 1]; if (n) loadWeek(n); });
document.getElementById('next').addEventListener('click', () => { const n = DATA && DATA.weeks[DATA.weeks.indexOf(DATA.week_of) - 1]; if (n) loadWeek(n); });
loadWeek(null);
</script>
<script src="talos-nav.js"></script>
</body>
</html>
