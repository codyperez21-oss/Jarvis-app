<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script src="talos-auth.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Talos — Needs you</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="talos-ui.css">
</head>
<body>
<header class="top">
  <div class="eyebrow">Talos</div>
  <h1 id="title">Needs you</h1>
  <div class="sub" id="subtitle">&nbsp;</div>
  <div class="seg" id="seg"><button type="button" data-tab="open" class="on">Open</button><button type="button" data-tab="history">History</button></div>
  <div class="fchips" id="fchips"></div>
</header>
<main id="root"><div class="sk"></div><div class="sk"></div><div class="sk"></div></main>
<div class="snack" id="snack" role="status"><span id="snackTxt"></span><button type="button" id="undoBtn">Undo</button></div>
<div class="toast" id="toast" role="alert"></div>
<div id="talosNav"></div><script src="talos-nav.js"></script>

<script src="talos-ui.js"></script>
<script>
const UNDO_MS = window.__UNDO_MS || 10000;
let D = null, HIDDEN = new Set(), PEND = [], EXPANDED = {}, FOCUS = null, NOTE = null, CARDS = [], TAB = 'open';
let BF = (() => { const b = new URLSearchParams(location.search).get('b'); return BIZ[b] ? b : 'all'; })();
const inBF = x => BF === 'all' || (x.business || 'rvltn') === BF;
const $ = s => document.querySelector(s);
const ikey = i => 'w:' + i.source + ':' + i.week_of + ':' + i.id;

function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 6000); }

function dueMs(i) { if (!i.due_at) return Infinity; const t = Date.parse(i.due_at.length === 10 ? i.due_at + 'T23:59:00' : i.due_at); return isNaN(t) ? Infinity : t; }
function when(ms) {
  if (ms === Infinity) return '';
  const d = ms - Date.now(), h = Math.round(d / 3600000);
  if (d < 0) return 'Overdue';
  if (h < 1) return 'Due within the hour';
  if (h < 24) return 'Due in ' + h + 'h';
  return 'Due ' + new Date(ms).toLocaleDateString('en-US', { weekday:'short', month:'short', day:'numeric' });
}
function ago(ms) { const m = Math.round((Date.now() - ms) / 60000); if (!ms || m < 1) return ''; if (m < 60) return m + 'm ago'; const h = Math.round(m / 60); if (h < 48) return h + 'h ago'; return Math.round(h / 24) + 'd ago'; }
function kindLabel(k) { return k === 'approve' ? 'Approval' : k === 'decide' ? 'Decision' : 'FYI'; }

function buildCards() {
  const items = (D.items || []).filter(i => !HIDDEN.has(ikey(i)) && inBF(i));
  const bySrc = {}; items.forEach(i => { if (i.kind === 'approve') { const gk = i.source + '|' + (i.business || 'rvltn'); (bySrc[gk] = bySrc[gk] || []).push(i); } });
  const cards = [], grouped = new Set();
  Object.keys(bySrc).forEach(s => {
    if (bySrc[s].length < 2) return;
    bySrc[s].forEach(i => grouped.add(ikey(i)));
    cards.push({ type:'group', key:'g:' + s, source:bySrc[s][0].source, business:bySrc[s][0].business, items:bySrc[s], due:Math.min.apply(null, bySrc[s].map(dueMs)), age:Math.min.apply(null, bySrc[s].map(i => Date.parse(i.report_updated_at) || 0)) });
  });
  items.forEach(i => { if (!grouped.has(ikey(i))) cards.push({ type:'item', key:ikey(i), item:i, due:dueMs(i), age:Date.parse(i.report_updated_at) || 0 }); });
  (D.batches || []).filter(b => !HIDDEN.has('b:' + b.batch_id) && inBF(b)).forEach(b => cards.push({ type:'batch', key:'b:' + b.batch_id, batch:b, due:Infinity, age:Date.parse(b.created_at) || 0 }));
  (D.social_batches || []).filter(b => !HIDDEN.has('s:' + b.batch_id) && inBF(b)).forEach(b => cards.push({ type:'social', key:'s:' + b.batch_id, batch:b, due:Date.parse(b.expires_at) || Infinity, age:Date.parse(b.created_at) || 0 }));
  cards.sort((a, b) => (a.due - b.due) || (a.age - b.age));
  return cards;
}
function preview(i) {
  return (i.image_url ? '<img class="q-img" loading="lazy" referrerpolicy="no-referrer" alt="" src="' + esc(i.image_url) + '">' : '') + (i.preview_text ? '<div class="q-prev">' + esc(i.preview_text) + '</div>' : '');
}
function itemButtons(i, key) {
  const B = (act, label, cls, extra) => '<button type="button" class="btn ' + (cls || '') + '" data-act="' + act + '" data-key="' + esc(key) + '"' + (extra || '') + '>' + esc(label) + '</button>';
  if (i.kind === 'approve') return B('approve', 'Approve', 'primary') + B('changes', 'Changes') + B('dismiss', 'Skip', 'ghost');
  if (i.kind === 'decide') return (i.options || []).map((o, n) => B('opt', o.label, n === 0 ? 'primary' : '', ' data-opt="' + esc(o.id) + '"')).join('') + B('other', 'Other…') + B('dismiss', 'Skip', 'ghost');
  return B('dismiss', 'Got it', 'primary');
}
function noteBox(key) {
  const show = NOTE && NOTE.key === key;
  return '<div class="note' + (show ? ' show' : '') + '"><input type="text" maxlength="1000" data-note="' + esc(key) + '" placeholder="' + (NOTE && NOTE.mode === 'other' ? 'What do you want? (required)' : 'What should change? (optional)') + '"><div class="q-act"><button type="button" class="btn primary" data-act="note-send" data-key="' + esc(key) + '">Send</button><button type="button" class="btn ghost" data-act="note-cancel" data-key="' + esc(key) + '">Cancel</button></div></div>';
}
function renderItem(c) {
  const i = c.item, k = c.key, d = when(c.due);
  const failed = i.status === 'failed' ? '<span class="pill red">Failed — decide again</span>' + (i.status_note ? '<div class="stline clamp">' + esc(i.status_note) + '</div>' : '') : '';
  return '<article class="q' + (FOCUS === k ? ' focus' : '') + '" tabindex="0" data-key="' + esc(k) + '"' + (i.kind !== 'decide' ? ' data-swipe="1"' : '') + '>' +
    '<div class="q-top">' + chip(i.source) + bizTag(i.business) + '<span class="pill">' + kindLabel(i.kind) + '</span><span class="sp"></span>' + (d ? '<span class="pill ' + (d === 'Overdue' ? 'red' : 'amber') + '">' + esc(d) + '</span>' : '') + '</div>' +
    '<h3 class="q-title">' + esc(i.text) + '</h3>' + preview(i) + (failed ? '<div style="margin-top:8px">' + failed + '</div>' : '') +
    '<div class="q-sub">' + esc(i.payload_ref || i.id) + (c.age ? ' · ' + esc(ago(c.age)) : '') + '</div>' +
    '<div class="q-act">' + itemButtons(i, k) + '</div>' + noteBox(k) + '</article>';
}
function renderGroup(c) {
  const k = c.key, open = !!EXPANDED[k], n = c.items.length;
  const inner = open ? c.items.map(i => {
    const ik = ikey(i);
    return '<div class="draft"><b>' + esc(i.text) + '</b>' + preview(i) + '<small>' + esc(i.payload_ref || i.id) + '</small><div class="q-act"><button type="button" class="btn primary" data-act="approve" data-key="' + esc(ik) + '">Approve</button><button type="button" class="btn" data-act="changes" data-key="' + esc(ik) + '">Changes</button></div>' + noteBox(ik) + '</div>';
  }).join('') : '';
  return '<article class="q' + (FOCUS === k ? ' focus' : '') + '" tabindex="0" data-key="' + esc(k) + '">' +
    '<div class="q-top">' + chip(c.source) + bizTag(c.business) + '<span class="pill">Approval</span><span class="sp"></span>' + (when(c.due) ? '<span class="pill amber">' + esc(when(c.due)) + '</span>' : '') + '</div>' +
    '<h3 class="q-title">Approve ' + n + ' ' + esc(botName(c.source)) + ' items</h3>' +
    (open ? '' : '<div class="q-prev">' + c.items.slice(0, 4).map(i => '• ' + esc(i.text.length > 110 ? i.text.slice(0, 110) + '…' : i.text)).join('\n') + (n > 4 ? '\n+ ' + (n - 4) + ' more' : '') + '</div>') +
    '<div class="drafts' + (open ? ' show' : '') + '">' + inner + '</div>' +
    '<div class="q-act"><button type="button" class="btn primary" data-act="approve-group" data-key="' + esc(k) + '">Approve all ' + n + '</button><button type="button" class="btn" data-act="expand" data-key="' + esc(k) + '">' + (open ? 'Collapse' : 'Review one by one') + '</button></div></article>';
}
function renderBatch(c) {
  const b = c.batch, k = c.key, open = !!EXPANDED[k], n = b.count, noun = b.kind === 'followup' ? 'follow-up emails' : b.kind === 'outreach' ? 'intro emails' : 'emails';
  const regions = (b.regions || []).filter(Boolean).join(', ');
  const drafts = open ? (b.items || []).map(x => '<div class="draft"><b>' + esc(x.practice_name) + '</b><small>' + esc([x.city, x.external_id].filter(Boolean).join(' · ')) + '</small><pre>' + esc(x.draft_text) + '</pre>' +
    '<div class="sb"><button type="button" class="btn ghost" data-act="sendback" data-key="' + esc(k) + '" data-lead="' + esc(x.lead_id) + '" data-draft="' + esc(x.draft_event_id) + '">Send back with a note</button></div>' + noteBox(k + ':' + x.draft_event_id) + '</div>').join('') : '';
  const peek = open ? '' : '<div class="q-prev">' + (b.items || []).slice(0, 4).map(x => '• ' + esc(x.practice_name) + ' — ' + esc(x.first_line || '')).join('\n') + (n > 4 ? '\n+ ' + (n - 4) + ' more' : '') + '</div>';
  return '<article class="q' + (FOCUS === k ? ' focus' : '') + '" tabindex="0" data-key="' + esc(k) + '">' +
    '<div class="q-top">' + chip('apollo') + bizTag('replete') + '<span class="pill">Approval</span><span class="sp"></span><span class="pill amber">Emails send after you approve</span></div>' +
    '<h3 class="q-title">Approve ' + n + ' ' + esc(noun) + '</h3><div class="q-sub">' + esc(b.label || b.batch_id) + (regions ? ' · ' + esc(regions) : '') + (c.age ? ' · ' + esc(ago(c.age)) : '') + '</div>' + peek +
    '<div class="drafts' + (open ? ' show' : '') + '">' + drafts + '</div>' +
    '<div class="q-act"><button type="button" class="btn primary" data-act="approve-batch" data-key="' + esc(k) + '"' + (open ? '' : ' disabled') + '>' + (open ? 'Approve ' + n : 'Read the emails to approve') + '</button><button type="button" class="btn" data-act="expand" data-key="' + esc(k) + '">' + (open ? 'Collapse' : 'Read all ' + n) + '</button><button type="button" class="btn ghost" data-act="skip-batch" data-key="' + esc(k) + '">Skip all</button></div></article>';
}
/* ---- social batches ---- */
const SOC = {}, SOCNOTE = {};
let SEDIT = null;
const platL = p => ({ instagram:'Instagram', linkedin:'LinkedIn', threads:'Threads', x:'X', tiktok:'TikTok' })[p] || p;
const actL = a => ({ comment:'Comment', reply:'Reply', connection_request:'Connection request', like:'Like', follow:'Follow' })[a] || a;
const sSt = (b, n) => (SOC[b.batch_id] || {})[n] || { d:'approve' };
function socLeft(ms) { const d = ms - Date.now(); if (!isFinite(d)) return ''; if (d <= 0) return 'Expired'; const h = Math.round(d / 3600000); return h < 1 ? 'Expires within the hour' : h < 48 ? 'Expires in ' + h + 'h' : 'Expires ' + new Date(ms).toLocaleDateString('en-US', { weekday:'short', month:'short', day:'numeric' }); }
function socText(x, st) { return st.d === 'edit' ? st.text : (x.action === 'connection_request' ? x.connection_note : x.draft_text); }
function socItem(b, x) {
  const st = sSt(b, x.item_no), k = 's:' + b.batch_id, ek = b.batch_id + '|' + x.item_no, editing = SEDIT === ek, skipped = st.d === 'skip';
  const txt = socText(x, st), url = safeUrl(x.target_url), da = ' data-key="' + esc(k) + '" data-item="' + esc(x.item_no) + '"';
  let h = '<div class="draft" style="' + (skipped ? 'opacity:.5' : '') + '"><b>' + esc(platL(x.platform) + ' · ' + actL(x.action) + ' · ' + x.target_handle) + '</b>';
  h += '<small>' + esc(x.target_display_name || '') + (url ? ' <a href="' + url + '" target="_blank" rel="noopener noreferrer" style="color:inherit">open post</a>' : '') + '</small>';
  if (x.target_context) h += '<div class="q-sub">' + esc(x.target_context) + '</div>';
  if (x.parent_comment) h += '<div class="q-sub">Replying to: ' + esc(x.parent_comment) + '</div>';
  if (x.prior_attempt) h += '<div class="q-sub">Earlier: ' + esc(x.prior_attempt) + '</div>';
  if (editing) h += '<textarea data-sedit="' + esc(ek) + '" style="width:100%;min-height:96px;margin-top:8px;background:var(--raised);color:inherit;border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;font-size:16px">' + esc(st.text || '') + '</textarea>';
  else if (txt) h += '<pre>' + esc(txt) + '</pre>' + (st.d === 'edit' ? '<div class="q-sub">Edited by you</div>' : '');
  h += '<div class="q-act" style="margin-top:8px">';
  if (editing) h += '<button type="button" class="btn primary" data-act="soc-save"' + da + '>Save edit</button><button type="button" class="btn ghost" data-act="soc-cancel"' + da + '>Cancel</button>';
  else {
    h += skipped ? '<button type="button" class="btn" data-act="soc-inc"' + da + '>Include</button>' : '<button type="button" class="btn ghost" data-act="soc-skip"' + da + '>Skip</button>';
    if (!skipped && x.action !== 'like' && x.action !== 'follow') h += '<button type="button" class="btn" data-act="soc-edit"' + da + '>Edit</button>';
  }
  return h + '</div></div>';
}
function renderSocial(c) {
  const b = c.batch, k = c.key, open = !!EXPANDED[k], items = b.items || [], st = SOC[b.batch_id] || {};
  const nSkip = items.filter(x => (st[x.item_no] || {}).d === 'skip').length, n = items.length - nSkip;
  const peek = open ? '' : '<div class="q-prev">' + items.slice(0, 4).map(x => '• ' + esc(platL(x.platform) + ' ' + actL(x.action).toLowerCase() + ' · ' + x.target_handle + ((x.draft_text || x.connection_note) ? ' — ' + (x.draft_text || x.connection_note).slice(0, 90) : ''))).join('\n') + (items.length > 4 ? '\n+ ' + (items.length - 4) + ' more' : '') + '</div>';
  const body = open ? items.map(x => socItem(b, x)).join('') + '<input type="text" maxlength="500" data-socnote="' + esc(b.batch_id) + '" value="' + esc(SOCNOTE[b.batch_id] || '') + '" placeholder="Note for Pheme (needed for Redraft, optional otherwise)" style="width:100%;margin-top:10px;min-height:44px;background:var(--raised);color:inherit;border:1px solid var(--line);border-radius:10px;padding:0 12px;font:inherit;font-size:16px">' : '';
  return '<article class="q' + (FOCUS === k ? ' focus' : '') + '" tabindex="0" data-key="' + esc(k) + '">' +
    '<div class="q-top">' + chip('pheme') + bizTag('social') + '<span class="pill">Approval</span><span class="sp"></span><span class="pill amber">' + esc(socLeft(Date.parse(b.expires_at))) + '</span></div>' +
    '<h3 class="q-title">Approve ' + items.length + ' social action' + (items.length === 1 ? '' : 's') + '</h3><div class="q-sub">' + esc(b.label || b.batch_id) + (c.age ? ' · ' + esc(ago(c.age)) : '') + ' · posts only after you approve</div>' + peek +
    '<div class="drafts' + (open ? ' show' : '') + '">' + body + '</div>' +
    '<div class="q-act"><button type="button" class="btn primary" data-act="soc-approve" data-key="' + esc(k) + '"' + (open ? '' : ' disabled') + '>' + (open ? 'Approve ' + n : 'Read all to approve') + '</button><button type="button" class="btn" data-act="expand" data-key="' + esc(k) + '">' + (open ? 'Collapse' : 'Review ' + items.length) + '</button>' +
    (open ? '<button type="button" class="btn" data-act="soc-hold" data-key="' + esc(k) + '">Hold</button><button type="button" class="btn" data-act="soc-redraft" data-key="' + esc(k) + '">Redraft</button>' : '') +
    '<button type="button" class="btn ghost" data-act="soc-reject" data-key="' + esc(k) + '">Skip batch</button></div></article>';
}
function socDecide(b, action, note) {
  const st = SOC[b.batch_id] || {}, items = [], seen = {};
  b.items.forEach(x => { seen[x.item_no] = x.draft_hash; const s = st[x.item_no]; if (s && s.d === 'skip') items.push({ item_no:x.item_no, decision:'skip' }); else if (s && s.d === 'edit') items.push({ item_no:x.item_no, decision:'edit', text:s.text }); });
  const n = b.items.length - items.filter(i => i.decision === 'skip').length;
  const label = action === 'approve' ? 'Approved ' + n + ' social action' + (n === 1 ? '' : 's') : action === 'hold' ? 'Held social batch' : 'Skipped social batch';
  schedule('s:' + b.batch_id, label, () => api('social-batch-decide', { method:'POST', body: JSON.stringify({ batchId:b.batch_id, action, items: action === 'approve' ? items : [], note: note || null, seen }) }).then(r => { delete SOC[b.batch_id]; return r; }));
}
function socAct(a, key, el, card) {
  if (!card) return;
  const b = card.batch, id = b.batch_id, n = +el.dataset.item, note = (SOCNOTE[id] || '').trim();
  SOC[id] = SOC[id] || {};
  if (a === 'soc-skip') { SOC[id][n] = { d:'skip' }; SEDIT = null; return renderAll(); }
  if (a === 'soc-inc') { delete SOC[id][n]; return renderAll(); }
  if (a === 'soc-edit') { const x = b.items.find(i => i.item_no === n); SOC[id][n] = { d:'edit', text: socText(x, sSt(b, n)) || '' }; SEDIT = id + '|' + n; return renderAll(); }
  if (a === 'soc-cancel') { delete SOC[id][n]; SEDIT = null; return renderAll(); }
  if (a === 'soc-save') { const x = b.items.find(i => i.item_no === n), s = SOC[id][n], t = ((s && s.text) || '').trim(), orig = x.action === 'connection_request' ? x.connection_note : x.draft_text; if (!t) return toast('Edited text can’t be empty.'); if (t === orig) delete SOC[id][n]; else SOC[id][n] = { d:'edit', text:t }; SEDIT = null; return renderAll(); }
  if (SEDIT && SEDIT.indexOf(id + '|') === 0) return toast('Save or cancel your edit first.');
  if (a === 'soc-approve') { if (!EXPANDED[key]) return toast('Open the batch first so you can read it.'); const left = b.items.filter(x => (SOC[id][x.item_no] || {}).d !== 'skip').length; if (!left) return toast('Everything is skipped. Use Skip batch instead.'); return socDecide(b, 'approve', note); }
  if (a === 'soc-hold') return socDecide(b, 'hold', note);
  if (a === 'soc-redraft') { if (!note) return toast('Type what Pheme should change in the note box first.'); return socDecide(b, 'hold', 'REDRAFT: ' + note); }
  if (a === 'soc-reject') return socDecide(b, 'reject', note);
}
function socRecent(b) {
  const L = { approved:'Sent to Pheme', in_progress:'Posting', done:'Done', failed:'Failed', held:'Held', redraft:'Redraft requested', rejected:'Skipped', expired:'Expired' };
  const cls = b.status === 'done' ? 'green' : (b.status === 'failed' || b.status === 'expired') ? 'red' : 'amber';
  const lines = (b.approved > 0 || b.status === 'done') ? (b.items || []).map(x => {
    let s;
    if (x.decision === 'skip') s = 'Skipped by you'; else if (!x.decision) return '';
    else if (x.result_status === 'posted_verified') { const u = safeUrl(x.live_url); s = 'Posted' + (u ? ' (<a href="' + u + '" target="_blank" rel="noopener noreferrer" style="color:inherit">view</a>)' : ''); }
    else if (x.result_status === 'posted_unverified') s = 'Posted, not verified';
    else if (x.result_status === 'skipped') s = 'Not posted' + (x.result_reason ? ': ' + esc(x.result_reason) : '');
    else s = 'Waiting';
    return '<div class="stline">' + esc(platL(x.platform) + ' ' + actL(x.action).toLowerCase() + ' · ' + x.target_handle) + ' — ' + (x.decision === 'skip' ? esc(s) : s) + '</div>';
  }).join('') : '';
  return '<div class="rec"><div class="t">' + esc(b.label) + ' · ' + esc(b.count) + ' actions</div><div class="m">' + chip('pheme') + bizTag('social') + '<span class="pill ' + cls + '">' + esc(L[b.status] || b.status) + '</span>' + (b.approved > 0 ? '<span>' + esc(b.posted) + '/' + esc(b.approved) + ' posted</span>' : '') + '</div>' + (b.note ? '<div class="q-sub">“' + esc(b.note) + '”</div>' : '') + (b.ack_note ? '<div class="stline">' + esc(b.ack_note) + '</div>' : '') + lines + '</div>';
}
function decisionText(r) {
  const d = r.decision; if (d === 'approve') return 'Approved'; if (d === 'changes') return 'Changes requested'; if (d === 'dismiss') return 'Dismissed'; if (d === 'other') return 'Your answer';
  if (String(d).indexOf('option:') === 0) { const o = (r.options || []).find(x => 'option:' + x.id === d); return o ? o.label : 'Chosen'; } return d;
}
function statusPill(r) {
  if (r.decision === 'dismiss') return '<span class="pill">Dismissed</span>';
  if (r.status === 'done') return '<span class="pill green">Done</span>';
  if (r.status === 'in_progress') return '<span class="pill amber">In progress</span>';
  return '<span class="pill amber">Sent to ' + esc(botName(r.source)) + '</span>';
}
const noteLine = r => r.status_note ? '<div class="stline clamp">' + esc(r.status_note) + '</div>' : '';
function histRow(r) {
  return '<div class="rec"><div class="t">' + esc(r.text.length > 140 ? r.text.slice(0, 140) + '…' : r.text) + '</div><div class="m">' + chip(r.source) + bizTag(r.business) + '<span>' + esc(decisionText(r)) + '</span>' + statusPill(r) + '</div>' + noteLine(r) + (r.comment ? '<div class="q-sub">“' + esc(r.comment) + '”</div>' : '') + '</div>';
}
function counts() {
  const c = { all: 0 }; const add = b => { b = b || 'rvltn'; c[b] = (c[b] || 0) + 1; c.all++; };
  (D.items || []).filter(i => !HIDDEN.has(ikey(i))).forEach(i => add(i.business)); (D.batches || []).filter(b => !HIDDEN.has('b:' + b.batch_id)).forEach(b => add(b.business)); (D.social_batches || []).filter(b => !HIDDEN.has('s:' + b.batch_id)).forEach(b => add('social'));
  return c;
}
function renderChips() {
  const c = counts(); let h = '<button type="button" class="fc' + (BF === 'all' ? ' on' : '') + '" data-bf="all">All' + (c.all ? ' <b>' + c.all + '</b>' : '') + '</button>';
  BIZ_ORDER.forEach(k => { if (c[k] || BF === k) h += '<button type="button" class="fc' + (BF === k ? ' on' : '') + '" data-bf="' + k + '">' + esc(BIZ[k].short) + (c[k] ? ' <b>' + c[k] + '</b>' : '') + '</button>'; });
  $('#fchips').innerHTML = h;
  document.querySelectorAll('#seg button').forEach(b => b.classList.toggle('on', b.dataset.tab === TAB));
}
function renderAll() {
  if (!D) return;
  CARDS = TAB === 'open' ? buildCards() : [];
  if (!FOCUS || !CARDS.some(c => c.key === FOCUS)) FOCUS = CARDS.length ? CARDS[0].key : null;
  const total = counts().all;
  document.title = (total ? '(' + total + ') ' : '') + 'Talos — Needs you';
  if (window.setNavBadge) window.setNavBadge(total);
  renderChips();
  let h = '';
  if (TAB === 'history') {
    const hist = (D.history || []).filter(inBF);
    $('#subtitle').textContent = 'Done and dismissed, last 30 days';
    h += hist.length ? hist.map(histRow).join('') : '<div class="empty"><h2>No history yet</h2><p>Finished and dismissed items show up here.</p></div>';
  } else {
    const n = CARDS.reduce((a, c) => a + (c.type === 'group' ? c.items.length : 1), 0);
    $('#subtitle').textContent = n ? n + (n === 1 ? ' thing is' : ' things are') + ' waiting on you' + (BF !== 'all' ? ' in ' + BIZ[BF].name : '') : 'Nothing waiting';
    if (CARDS.length) {
      h += '<div class="hint touch">Swipe right to approve, left to request changes.</div><div class="hint keys">J / K move · A approve · C changes · 1–4 options · E expand · U undo</div>';
      h += CARDS.map(c => c.type === 'group' ? renderGroup(c) : c.type === 'batch' ? renderBatch(c) : c.type === 'social' ? renderSocial(c) : renderItem(c)).join('');
    } else {
      const nx = D.next_scheduled;
      h += '<div class="empty"><h2>' + (BF === 'all' ? 'You’re all caught up' : 'Nothing waiting here') + '</h2><p>' + (BF !== 'all' ? 'No open items for ' + esc(BIZ[BF].name) + '.' : nx ? 'Next up: ' + esc(nx.label) + ' · ' + esc(nx.source === 'talos' ? 'Schedule' : botName(nx.source)) + ', ' + esc(new Date(nx.at).toLocaleString('en-US', { weekday:'short', hour:'numeric', minute:'2-digit' })) : 'Nothing is scheduled yet.') + '</p></div>';
    }
    const rec = (D.recent || []).filter(r => inBF(r) && !HIDDEN.has('w:' + r.source + ':' + r.week_of + ':' + r.item_id));
    const mine = PEND.map(p => '<div class="rec"><div class="t">' + esc(p.label) + '</div><div class="m"><span class="pill">Sending in a moment — Undo</span></div></div>').join('');
    if (rec.length || mine) h += '<div class="sec">In progress</div>' + mine + rec.map(histRow).join('');
    const srec = (D.social_recent || []).filter(x => BF === 'all' || BF === 'social');
    if (srec.length) h += '<div class="sec">Social batches · last 14 days</div>' + srec.map(socRecent).join('');
  }
  const active = document.activeElement && document.activeElement.matches && document.activeElement.matches('input[data-note]') ? document.activeElement.value : null;
  $('#root').innerHTML = h;
  if (SEDIT) { const ta = document.querySelector('textarea[data-sedit="' + CSS.escape(SEDIT) + '"]'); if (ta) ta.focus(); }
  if (NOTE) { const inp = document.querySelector('input[data-note="' + CSS.escape(NOTE.key) + '"]'); if (inp) { if (active != null) inp.value = active; inp.focus(); } }
}
async function load() {
  try { D = await api('needs-overview'); renderAll(); }
  catch (e) { if (!D) $('#root').innerHTML = '<div class="err">Couldn’t load: ' + esc(e.message) + ' <button class="btn" style="margin-top:10px" onclick="load()">Retry</button></div>'; }
}

/* ---- deferred commit with undo ---- */
function schedule(keys, label, run) {
  const p = { keys: [].concat(keys), label, run, end: Date.now() + UNDO_MS, t: null, focus: FOCUS };
  p.t = setTimeout(() => fire(p), UNDO_MS); PEND.push(p); HIDDEN = new Set([...HIDDEN, ...p.keys]);
  NOTE = null; renderAll(); renderSnack();
}
async function fire(p) {
  clearTimeout(p.t); if (!PEND.includes(p)) return; PEND = PEND.filter(x => x !== p); renderSnack();
  try { const res = await p.run(); if (res && res.skipped && res.skipped.length) toast(res.skipped.length + ' skipped: ' + (res.skipped[0].reason || 'changed since you looked')); }
  catch (e) { p.keys.forEach(k => HIDDEN.delete(k)); toast('Couldn’t save: ' + e.message); }
  await load(); p.keys.forEach(k => HIDDEN.delete(k)); renderAll();
}
function undo() { const p = PEND.pop(); if (!p) return; clearTimeout(p.t); p.keys.forEach(k => HIDDEN.delete(k)); if (p.focus) FOCUS = p.focus; renderAll(); renderSnack(); }
function renderSnack() {
  const s = $('#snack'); if (!PEND.length) { s.classList.remove('show'); clearInterval(renderSnack._i); return; }
  const upd = () => { const p = PEND[PEND.length - 1]; if (!p) return; $('#snackTxt').textContent = p.label + (PEND.length > 1 ? ' (+' + (PEND.length - 1) + ')' : '') + ' · ' + Math.max(0, Math.ceil((p.end - Date.now()) / 1000)) + 's'; };
  s.classList.add('show'); upd(); clearInterval(renderSnack._i); renderSnack._i = setInterval(upd, 250);
}
const short = t => t.length > 48 ? t.slice(0, 48) + '…' : t;
const findItem = key => (D.items || []).find(i => ikey(i) === key);
function sendItem(i, decision, comment, label) {
  schedule(ikey(i), label + ': ' + short(i.text), () => api('weekly-decide', { method:'POST', body: JSON.stringify({ source:i.source, weekOf:i.week_of, itemId:i.id, decision, comment: comment || null }) }));
}
function approveGroup(c) {
  schedule(c.items.map(ikey), 'Approved ' + c.items.length + ' ' + botName(c.source) + ' items', async () => {
    for (const i of c.items) await api('weekly-decide', { method:'POST', body: JSON.stringify({ source:i.source, weekOf:i.week_of, itemId:i.id, decision:'approve', comment:null }) });
  });
}
function batchDecide(b, action) {
  const ids = (b.items || []).map(x => x.draft_event_id);
  schedule('b:' + b.batch_id, (action === 'approve' ? 'Approved ' : 'Skipped ') + b.count + ' emails', () => api('pipeline-batch-decide', { method:'POST', body: JSON.stringify({ batchId:b.batch_id, action, draftEventIds:ids }) }));
}
function openNote(key, mode) { NOTE = { key, mode }; renderAll(); }
function act(a, key, el) {
  const card = CARDS.find(c => c.key === key);
  if (a.indexOf('soc-') === 0) return socAct(a, key, el, card);
  if (a === 'approve-group') return approveGroup(card);
  if (a === 'expand') { EXPANDED[key] = !EXPANDED[key]; return renderAll(); }
  if (a === 'approve-batch') { if (!EXPANDED[key]) return toast('Open the emails first so you can read them.'); return batchDecide(card.batch, 'approve'); }
  if (a === 'skip-batch') return batchDecide(card.batch, 'reject');
  if (a === 'sendback') { return openNote(key + ':' + el.dataset.draft, 'sendback:' + el.dataset.lead + ':' + el.dataset.draft); }
  if (a === 'note-cancel') { NOTE = null; return renderAll(); }
  if (a === 'note-send') {
    const inp = document.querySelector('input[data-note="' + CSS.escape(key) + '"]'), v = inp ? inp.value.trim() : '';
    if (NOTE && NOTE.mode.indexOf('sendback:') === 0) {
      const p = NOTE.mode.split(':'); if (!v) return toast('Add a note so Apollo knows what to fix.');
      NOTE = null;
      return api('pipeline-batch-sendback', { method:'POST', body: JSON.stringify({ leadId:p[1], draftEventId:p[2], note:v }) }).then(() => { toast('Sent back to Apollo.'); return load(); }).catch(e => toast('Couldn’t send back: ' + e.message));
    }
    const it = findItem(key); if (!it) return;
    if (NOTE && NOTE.mode === 'other') { if (!v) return toast('Add a few words so Hermes knows what you want.'); return sendItem(it, 'other', v, 'Answered'); }
    return sendItem(it, 'changes', v, 'Changes requested');
  }
  const it = findItem(key); if (!it) return;
  if (a === 'approve') return sendItem(it, 'approve', null, 'Approved');
  if (a === 'changes') return openNote(key, 'changes');
  if (a === 'other') return openNote(key, 'other');
  if (a === 'opt') return sendItem(it, 'option:' + el.dataset.opt, null, 'Chose ' + ((it.options || []).find(o => o.id === el.dataset.opt) || {}).label);
  if (a === 'dismiss') return sendItem(it, 'dismiss', null, 'Skipped');
}
document.addEventListener('click', e => {
  const cl = e.target.closest('.clamp'); if (cl) { cl.classList.toggle('open'); return; }
  const t = e.target.closest('[data-tab]'); if (t) { TAB = t.dataset.tab; NOTE = null; renderAll(); return; }
  const f = e.target.closest('[data-bf]'); if (f) { BF = f.dataset.bf; FOCUS = null; NOTE = null; try { history.replaceState(null, '', BF === 'all' ? 'needs.html' : 'needs.html?b=' + BF); } catch (x) {} renderAll(); return; }
  const b = e.target.closest('[data-act]'); if (b && !b.disabled) act(b.dataset.act, b.dataset.key, b);
});
document.addEventListener('input', e => { const t = e.target; if (!t.matches) return; if (t.matches('textarea[data-sedit]')) { const p = t.dataset.sedit.split('|'); (SOC[p[0]] = SOC[p[0]] || {})[p[1]] = { d:'edit', text:t.value }; } else if (t.matches('input[data-socnote]')) SOCNOTE[t.dataset.socnote] = t.value; });
$('#undoBtn').addEventListener('click', undo);

/* ---- swipe ---- */
let sw = null;
document.addEventListener('pointerdown', e => { const c = e.target.closest('.q[data-swipe]'); if (!c || e.target.closest('button,input,a,pre')) return; sw = { c, x:e.clientX, y:e.clientY, dx:0, lock:false }; });
document.addEventListener('pointermove', e => {
  if (!sw) return; const dx = e.clientX - sw.x, dy = e.clientY - sw.y;
  if (!sw.lock) { if (Math.abs(dy) > 12 && Math.abs(dy) > Math.abs(dx)) { sw = null; return; } if (Math.abs(dx) > 12) sw.lock = true; }
  if (sw.lock) { sw.dx = dx; sw.c.style.transform = 'translateX(' + dx + 'px)'; sw.c.dataset.dir = dx > 0 ? 'r' : 'l'; }
});
function endSwipe() {
  if (!sw) return; const { c, dx } = sw; sw = null; c.style.transform = ''; delete c.dataset.dir;
  if (Math.abs(dx) < 90) return;
  const key = c.dataset.key, it = findItem(key); if (!it) return;
  if (dx > 0) sendItem(it, it.kind === 'fyi' ? 'dismiss' : 'approve', null, it.kind === 'fyi' ? 'Got it' : 'Approved');
  else if (it.kind === 'approve') openNote(key, 'changes');
}
document.addEventListener('pointerup', endSwipe); document.addEventListener('pointercancel', endSwipe);

/* ---- keyboard ---- */
document.addEventListener('keydown', e => {
  if (e.target.matches && e.target.matches('input,textarea')) { if (e.key === 'Escape') { NOTE = null; renderAll(); } else if (e.key === 'Enter') { const nb = e.target.closest('.note'), b = nb && nb.querySelector('[data-act="note-send"]'); if (b) b.click(); } return; }
  if (e.metaKey || e.ctrlKey || e.altKey || !D) return;
  const k = e.key.toLowerCase(); let idx = CARDS.findIndex(c => c.key === FOCUS); const c = CARDS[idx];
  if (k === 'j' || k === 'k') { idx = Math.max(0, Math.min(CARDS.length - 1, idx + (k === 'j' ? 1 : -1))); FOCUS = CARDS[idx] && CARDS[idx].key; renderAll(); const el = document.querySelector('.q.focus'); if (el) el.scrollIntoView({ block:'center', behavior:'smooth' }); return; }
  if (k === 'u' || k === 'z') return undo();
  if (!c) return;
  if (k === 'e' && c.type !== 'item') return act('expand', c.key);
  if (c.type === 'group') { if (k === 'a') approveGroup(c); return; }
  if (c.type === 'batch') { if (k === 'a') act('approve-batch', c.key); return; }
  if (c.type === 'social') return;
  const it = c.item;
  if (k === 'a' && it.kind === 'approve') act('approve', c.key);
  else if (k === 'c' && it.kind === 'approve') act('changes', c.key);
  else if (k === 'd' || (k === 'a' && it.kind === 'fyi')) act('dismiss', c.key);
  else if (/^[1-4]$/.test(k) && it.kind === 'decide' && it.options && it.options[+k - 1]) act('opt', c.key, { dataset:{ opt: it.options[+k - 1].id } });
  else if (k === 'o' && it.kind === 'decide') act('other', c.key);
});
window.addEventListener('pagehide', () => { PEND.slice().forEach(p => { clearTimeout(p.t); p.run().catch(() => {}); }); PEND = []; });
setInterval(() => { const a = document.activeElement; if (!document.hidden && !PEND.length && !(a && a.matches && a.matches('input,textarea'))) load(); }, 30000);
load();
</script>
